<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel CRM — Protótipo de Segmentação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7FB;
  --surface:#FFFFFF;
  --border:#E3E8EF;
  --border-strong:#CFD6E0;
  --primary:#0B7BFB;
  --primary-hover:#0A6BDB;
  --primary-soft:#E7F1FE;
  --primary-disabled:#9CCBFD;
  --ink:#0F2846;
  --ink-2:#3C4A5C;
  --ink-3:#6B7A8D;
  --ink-4:#9AA6B4;
  --green:#16A863;
  --green-soft:#DDF5E9;
  --pink:#D6336C;
  --pink-soft:#FDE4EC;
  --warn-bg:#FEF3D7;
  --warn-border:#EFC96A;
  --warn-ink:#7A5A12;
  --danger:#D14343;
  --danger-soft:#FDECEC;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,36,64,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:14px}

/* ---------- Chrome do app ---------- */
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border)}
.shell{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:88px;background:#fff;border-right:1px solid var(--border);flex:0 0 88px}
.main{flex:1;padding:34px 44px 0;display:flex;flex-direction:column}
.footer{margin-top:auto;padding:26px 0 22px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-4)}
.footer strong{color:var(--ink-3)}
.brand{font-weight:800;letter-spacing:.02em;color:var(--ink);font-size:13px}

h1.page{font-size:24px;font-weight:700;margin:0 0 18px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tab{padding:8px 2px 12px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tab:not(.active):hover{color:var(--ink)}

.searchrow{display:flex;gap:12px;margin-bottom:26px}
.search{flex:1;position:relative}
.search input{width:100%;height:46px;border:1px solid var(--border-strong);border-radius:999px;padding:0 16px 0 44px;outline:none;background:#fff}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search svg{position:absolute;left:16px;top:14px;color:var(--ink-4)}

.btn{height:46px;padding:0 20px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.12s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:disabled{background:var(--primary-disabled);cursor:not-allowed}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-soft:hover{background:#D6E7FD}
.btn-ghost{color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink)}
.btn-sm{height:38px;padding:0 14px;font-size:13px;border-radius:8px}

/* ---------- Empty state ---------- */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;color:var(--ink-3)}
.empty h2{font-size:19px;font-weight:700;color:var(--ink);margin:22px 0 10px;line-height:1.35}
.empty p{max-width:440px;margin:0;font-size:14px;line-height:1.55}

/* ---------- Wizard ---------- */
.wizhead{display:flex;align-items:flex-start;gap:32px;margin-bottom:24px}
.wizhead .title{flex:0 0 auto;max-width:520px}
.wizhead h1{font-size:23px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;line-height:1.3}
.stepper{display:flex;gap:14px;flex:1;border-left:1px solid var(--border);padding-left:32px;align-items:flex-start;flex-wrap:wrap}
.step{min-width:92px;text-align:left}
.step .bar{height:3px;border-radius:2px;background:#DCE9F8;margin-bottom:8px}
.step.done .bar,.step.current .bar{background:var(--primary)}
.step .lbl{font-size:12.5px;color:var(--ink-4)}
.step.done .lbl{color:var(--ink-2)}
.step.current .lbl{color:var(--ink);font-weight:600}
.step[data-clickable="1"]{cursor:pointer}

.backlink{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:14px;margin-bottom:14px}
.backlink:hover{color:var(--ink)}

.wizbody{display:flex;gap:20px;align-items:stretch;flex:1;min-height:560px;padding-bottom:8px}
.panel{flex:1;min-width:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:visible}
.panel-head{display:flex;gap:14px;padding:20px 22px;border-bottom:1px solid var(--border);align-items:flex-start;border-radius:var(--radius) var(--radius) 0 0}
.panel-icon{width:38px;height:38px;border-radius:9px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;color:var(--primary);flex:0 0 38px}
.panel-head h2{margin:0 0 3px;font-size:17px;font-weight:600}
.panel-head p{margin:0;color:var(--ink-3);font-size:13.5px}
.panel-body{padding:20px 22px;flex:1}

/* ---------- Períodos fechados de compra (etapa Produtos) ---------- */
.percaixa{border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:20px;background:#FBFCFE}
.perhead{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.seg.segsm button{height:32px;padding:0 14px;font-size:12.5px}
.pertags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{color:var(--primary);font-weight:600;font-size:12.5px;text-decoration:underline;margin-left:10px}
.linkbtn:disabled{color:var(--ink-4);text-decoration:none;cursor:default}
.selacts{display:inline-flex;align-items:center;gap:2px;margin-left:12px;font-weight:400}
.selacts .sep{color:var(--ink-4);margin-left:10px}
.selacts .linkbtn{margin-left:10px}
.btnfiltro{height:44px;border:1px solid var(--border-strong);border-radius:8px;padding:0 15px;background:#fff;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.btnfiltro:hover{border-color:var(--primary);color:var(--primary)}
.janela-nota{margin:10px 0 0;font-size:11px;color:var(--ink-4);text-align:center;line-height:1.4}

/* ---------- Seletor de períodos (meses e semanas) ---------- */
.dpwrap{position:relative;z-index:40}
.dptrigger{display:flex;align-items:center;gap:9px;height:42px;padding:0 14px;border:1px solid var(--border-strong);
  border-radius:9px;background:#fff;font-size:13px;color:var(--ink-2);min-width:250px;transition:.12s}
.dptrigger span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dptrigger:hover{border-color:var(--primary)}
.dptrigger.tem{color:var(--ink);font-weight:600}
.dptrigger.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.dppop{position:absolute;top:calc(100% + 8px);right:0;z-index:55;width:308px;background:#fff;
  border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 14px 40px rgba(15,35,60,.18);overflow:hidden}
.dp-head{padding:12px 14px 0}
.dp-head .seg{width:100%}
.dp-head .seg button{flex:1}
.dp-body{padding:12px 14px 4px}
.dp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--border);background:#FBFCFE}
.dp-foot .linkbtn{margin-left:0}
.btnsm{height:34px;padding:0 16px;font-size:12.5px;border-radius:8px}
.dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dp-nav b{font-size:13.5px;font-weight:600;color:var(--ink)}
.dp-nav button{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.12s}
.dp-nav button:hover:not(:disabled){background:#EDF1F6;color:var(--ink)}
.dp-nav button:disabled{color:#CBD5E1;cursor:default}
.dp-meses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:8px}
.dp-m{height:38px;border-radius:8px;border:1px solid transparent;font-size:12.5px;color:var(--ink-2);text-transform:capitalize;transition:.12s}
.dp-m:hover:not(:disabled){background:#EDF1F6;color:var(--ink)}
.dp-m:disabled{color:#CBD5E1;cursor:default}
.dp-m.on{background:var(--primary);color:#fff;font-weight:600}
.dp-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 30px 4px 4px}
.dp-dow i{font-style:normal;font-size:10.5px;font-weight:600;color:var(--ink-4);text-align:center}
.dp-wks{display:flex;flex-direction:column;gap:3px}
.dp-wk{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:8px;border:1px solid transparent;transition:.12s;width:100%}
.dp-wk-dias{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-wk-dias i{font-style:normal;font-size:12px;color:var(--ink-2);text-align:center;line-height:26px}
.dp-wk-dias i.fora{color:#CBD5E1}
.dp-wk-dias i.hoje{font-weight:700;color:var(--primary)}
.dp-wk-tag{width:22px;display:flex;align-items:center;justify-content:center;color:#fff}
.dp-wk:hover:not(:disabled){background:#EDF1F6}
.dp-wk:disabled{opacity:.42;cursor:default}
.dp-wk.on{background:var(--primary)}
.dp-wk.on .dp-wk-dias i,.dp-wk.on .dp-wk-dias i.fora,.dp-wk.on .dp-wk-dias i.hoje{color:#fff}
.dp-nota{margin:10px 0 4px;font-size:11px;color:var(--ink-4);line-height:1.45}

/* ---------- Faixas de aderência: uma seção por faixa ---------- */
.gcount{font-size:11px;font-weight:600;color:#0B6FD0;background:var(--primary-soft);border-radius:999px;
  padding:2px 9px;margin-left:7px;vertical-align:2px;letter-spacing:.01em}
.dna-caret{display:inline-flex;color:var(--ink-4);transition:.15s}
.dna-caret.on{transform:rotate(180deg)}
.dna.aberto .dna-row{border-bottom:1px solid var(--border)}

.gsecs{background:#F1F5FA}
.gsec{background:#F1F5FA;padding:22px 26px 24px;border-bottom:1px solid var(--border);cursor:pointer;transition:.14s}
.gsec:hover{background:#E9F0F8}
.gsec.on{background:#fff}
.gsec.on:hover{background:#fff}
.gsec-head{display:flex;align-items:center;gap:15px;margin-bottom:12px}
.gsec-tit{margin:0;font-size:19px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:#8C9CB0;transition:.14s}
.gsec.on .gsec-tit{color:var(--ink)}
.gsec-desc{margin:0 0 18px;font-size:14px;color:#5B7290;line-height:1.5;max-width:860px;transition:.14s}
.gsec.on .gsec-desc{color:var(--ink)}
.switch.travado{background:#DDE4EC;cursor:not-allowed;opacity:.75}
.switch.travado:after{box-shadow:none}
.gsec-nota{display:flex;gap:8px;align-items:flex-start;margin:0;padding:12px 20px 4px;
  font-size:12.5px;color:var(--ink-3);line-height:1.45}
.gsec-nota.alerta{color:var(--danger)}
.gsec-nota svg{flex:0 0 14px;margin-top:2px}
.gfechar{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px 0 12px;
  font-size:13px;font-weight:600;color:var(--primary)}
.gfechar:hover{text-decoration:underline}
.gf-caret{display:inline-flex;transform:rotate(180deg)}

/* duas colunas simples, separadas só pelo espaço — sem ícone, sem marcador
   e sem divisória, como no modelo do produto */
.dna-par{display:flex;gap:34px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:15px}
.dna-par-col{flex:1;min-width:240px}
.dna-par-tit{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
  font-weight:600;color:var(--ink-3);margin-bottom:9px}
.dna-par .li{font-size:13px;color:#5B7290;line-height:1.75;padding:1px 0}
.gsec.on .dna-par .li{color:var(--ink-2)}

/* ---------- Funil da estimativa ---------- */
.funil{border:1px solid var(--border);border-radius:9px;margin:12px 0 4px;overflow:hidden}
.funil.on{border-color:#CFE0F5;background:#FBFDFF}
.fn-head{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:left}
.fn-head:hover{color:var(--primary)}
.fn-head span{flex:1}
.fn-caret{display:inline-flex;transition:.15s}
.funil.on .fn-caret{transform:rotate(180deg)}
.fn-body{padding:0 12px 12px}
.fn-hint{margin:0 0 12px;font-size:11.5px;color:var(--ink-4);line-height:1.45}
.fn-item{margin-bottom:11px}
.fn-item:last-child{margin-bottom:0}
.fn-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.fn-nome{font-size:12.5px;color:var(--ink-2)}
.fn-num{font-size:13px;font-weight:700;color:var(--ink)}
.fn-bar{height:7px;border-radius:4px;background:#E8EEF6;overflow:hidden}
.fn-bar i{display:block;height:100%;border-radius:4px;background:var(--primary);transition:width .3s}
.fn-bar i.bad{background:var(--danger)}
.fn-sub{margin-top:3px;font-size:11px;color:var(--ink-4)}
.fn-corte{color:#B4531F;font-weight:600}
.fn-corte.none{color:var(--ink-4);font-weight:400}
.fn-corte.bad{color:var(--danger);font-weight:700}
.fn-base{color:var(--ink-4)}

.infobox{background:#E9F2FE;border-radius:8px;padding:14px 16px;color:#123A63;font-size:13px;line-height:1.55;margin-bottom:18px}

/* ---------- Aside estimativa ---------- */
.aside{flex:0 0 306px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:sticky;top:18px;z-index:1;align-self:flex-start}
.aside h3{margin:0 0 14px;font-size:14px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.bignum{background:#F5F8FC;border-radius:8px;padding:16px;margin-bottom:10px}
.bignum .v{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.bignum .c{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.metric{background:#F5F8FC;border-radius:8px;padding:11px 14px;margin-bottom:8px}
.metric .k{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;margin-bottom:3px}
.metric .k svg{color:var(--primary)}
.metric .v{font-size:15px;font-weight:600}
.aside-actions{border-top:1px solid var(--border);margin-top:14px;padding-top:14px;display:flex;flex-direction:column;gap:10px}
.aside .btn{width:100%}
.nav-pair{display:flex;gap:10px}
.nav-pair .btn{flex:1}
.stale .bignum,.stale .metric{opacity:.38;filter:grayscale(.35)}
.stale-flag{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.stale-flag b{display:block;color:#5F4708;font-weight:700;margin-bottom:2px}
.stale-flag b + b,.stale-flag b:not(:first-child){display:inline;margin:0;font-weight:600}
.warnbox{background:var(--warn-bg);border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.45;color:var(--warn-ink);display:flex;gap:9px;margin-top:12px}
.warnbox b{display:block;color:#5F4708}

.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#EDF1F6 25%,#F7FAFD 50%,#EDF1F6 75%);background-size:200% 100%;animation:sk 1.1s infinite;border-radius:6px;color:transparent!important}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Form bits ---------- */
.field{margin-bottom:0}
.field label{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:5px}
.input{height:44px;border:1px solid var(--border-strong);border-radius:8px;padding:0 12px;background:#fff;outline:none;width:100%;color:var(--ink)}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input.err{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.errmsg{display:flex;gap:7px;align-items:flex-start;color:var(--danger);font-size:12.5px;margin-top:10px;background:var(--danger-soft);padding:9px 11px;border-radius:7px}

.chip{border:1px solid transparent;background:#EDF1F6;color:var(--ink-2);border-radius:999px;padding:7px 15px;font-size:13px;transition:.12s}
.chip:hover{background:#E2E8F0}
.chip.on{background:var(--primary);color:#fff}
.chipwrap{display:flex;flex-wrap:wrap;gap:9px}
.sublabel{font-size:13px;font-weight:600;margin:0 0 9px}
.sublabel + .chipwrap{margin-bottom:22px}

.switch{width:38px;height:21px;border-radius:999px;background:#CBD5E1;position:relative;flex:0 0 38px;transition:.15s}
.switch:after{content:'';position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--primary)}
.switch.on:after{transform:translateX(17px)}

/* ---------- RFV cards ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rfv{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff;transition:.12s;text-align:left;display:block;width:100%}
.rfv:hover{border-color:var(--border-strong)}
.rfv.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.rfv-top{padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.rfv-top h4{margin:0 0 4px;font-size:17px;font-weight:600}
.rfv-top p{margin:0;font-size:13px;color:var(--ink-3);line-height:1.45}
.rfv-bot{padding:13px 18px;border-top:1px solid var(--border);background:#FBFCFE;font-size:12.5px;color:var(--ink-3)}
.rfv-bot b{display:block;font-weight:500;color:var(--ink-2);margin-bottom:3px}

/* ---------- DNA cards ---------- */
.dna{border:1px solid var(--border);border-radius:9px;background:#fff;margin-bottom:12px;overflow:hidden;transition:.12s}
.dna.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.dna-row{display:flex;align-items:stretch;cursor:pointer}
.dna-row:hover{background:#FAFCFE}
.dna-a{flex:1.6;padding:22px 26px;display:flex;gap:15px;align-items:flex-start;text-align:left}
.dna-a h4{margin:0 0 4px;font-size:21px;font-weight:500;line-height:1.25}
.dna-a p{margin:0;font-size:13px;color:var(--ink-3);line-height:1.5}
.dna-b{flex:0 0 268px;padding:22px 26px 22px 0;font-size:12.5px;color:var(--ink-3);line-height:1.55}
.dna-b b{display:block;font-weight:600;color:var(--ink-2);margin-bottom:4px;font-size:12.5px}
.dna-c{flex:0 0 52px;padding:15px 18px;border-left:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--border-strong);background:#fff;border-radius:6px;padding:5px 11px;font-size:12.5px;color:var(--ink-2)}
.seg button:hover{border-color:var(--primary);color:var(--primary)}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg button:disabled:hover{border-color:var(--border-strong);color:var(--ink-2)}

/* ---------- Tabelas ---------- */
.selbox{background:#F5F8FC;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.selbox .t{font-weight:600;font-size:13.5px;margin-bottom:10px}
.selbox .muted{color:var(--ink-3);font-size:13px;text-align:center;padding:2px 0}
.tag{display:inline-flex;align-items:center;gap:7px;background:var(--primary-soft);color:#0B6FD0;border-radius:6px;padding:5px 9px;font-size:12.5px;font-weight:600;margin:0 7px 7px 0}
.tag button{color:#0B6FD0;font-weight:700;line-height:1}
.filters{display:flex;gap:12px;margin-bottom:14px;align-items:flex-end;flex-wrap:wrap}
.filters .search{flex:1;min-width:230px}
.filters .search input{height:44px}
.filters .search svg{top:13px}
.filters .field{flex:0 0 158px}
.tablewrap{border:1px solid var(--border);border-radius:9px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F5F8FC;text-align:left;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--ink)}
td{padding:11px 14px;border-bottom:1px solid #EFF3F8;color:var(--ink-2)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFCFE;cursor:pointer}
tbody tr.sel{background:#F3F8FF}
.cb{width:17px;height:17px;border:1.5px solid var(--border-strong);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:#fff;vertical-align:middle}
.cb.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cb.mixed{background:var(--primary);border-color:var(--primary);color:#fff}
.pager{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 4px 0;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.pgesq{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.pgsep{color:var(--ink-4);margin:0 8px}
.selinfo{font-weight:600;color:var(--ink-2)}
.pgesq .linkbtn{margin-left:12px}
.avisozero{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:12.5px;color:var(--danger);line-height:1.45}
.pager .pg{display:flex;gap:6px}
.pager .pg button{border:1px solid var(--border-strong);background:#fff;border-radius:6px;min-width:30px;height:30px;font-size:12.5px;color:var(--ink-2)}
.pager .pg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tempty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
.tempty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:5px}

/* ---------- Filtro de status da lista ---------- */
.stbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.stchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-strong);background:#fff;
  border-radius:999px;padding:8px 15px;font-size:13px;color:var(--ink-2);transition:.12s}
.stchip i{font-style:normal;font-size:11.5px;font-weight:700;background:#EDF1F6;color:var(--ink-3);
  border-radius:999px;padding:2px 7px;min-width:20px;text-align:center}
.stchip:hover{border-color:var(--primary);color:var(--primary)}
.stchip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.stchip.on i{background:rgba(255,255,255,.24);color:#fff}
.stchip.zero:not(.on){color:var(--ink-4)}

/* ---------- Cards de segmentação ---------- */
.segcard{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  margin-bottom:16px;overflow:hidden}

.sc-topo{display:flex;align-items:center;gap:26px;padding:22px 24px 20px}
.sc-ident{flex:1;min-width:0}
.sc-ident h3{margin:0 0 5px;font-size:21px;font-weight:700;line-height:1.25;color:var(--ink)}
.sc-ident .obj{margin:0 0 8px;font-size:14px;color:var(--ink);line-height:1.45}
.sc-ate{display:flex;align-items:center;gap:7px;margin:0;font-size:13px;color:var(--ink-3)}

.sc-kpis{display:flex;gap:12px;flex-shrink:0}
.kbox{border:1px solid var(--border);border-radius:9px;padding:12px 22px;min-width:172px;text-align:center;background:#fff}
.kbox span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.kbox b{display:block;font-size:21px;font-weight:700;color:var(--ink);line-height:1.2}

/* Aberto, o rodapé de filtros e o painel de campanhas viram UMA gaveta só:
   mesmo fundo, sem linha entre eles. O que separa é a borda de cima, que marca
   onde termina a identificação da segmentação e começa o detalhe dela. */
.sc-rodape{display:flex;align-items:center;gap:18px;flex-wrap:wrap;width:100%;
  padding:13px 24px;border-top:1px solid var(--border);background:#fff;text-align:left;transition:.12s}
.sc-rodape:hover{background:#FAFCFE}
.sc-rodape.on{background:#F4F7FB;border-top-color:#DCE5EF}
.sc-rodape.on:hover{background:#EFF4FA}
.sc-filtros,.sc-camps-res{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sc-filtros{flex:1;min-width:0}
.sc-filtros svg,.sc-camps-res svg{color:var(--ink-4);flex-shrink:0}
.sc-filtros i,.sc-camps-res i{font-style:normal;font-size:12.5px;color:var(--ink-3)}
.fpill{border:1px solid var(--border);background:#fff;border-radius:7px;padding:5px 11px;
  font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.fpill b{color:var(--ink-2);font-weight:600}
.fpill.viva{border-color:#BFD9F5;background:var(--primary-soft);color:#0B6FD0}
.fpill.viva b{color:#0B6FD0}
.sc-caret{display:inline-flex;color:var(--ink-3);transition:.15s;margin-left:2px}
.sc-caret.on{transform:rotate(180deg)}

/* mesma cor do rodapé aberto e sem borda: a gaveta é contínua */
.sc-painel{background:#F4F7FB;padding:4px 24px 22px}
.sc-painel-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:14px 0 12px;margin-bottom:4px;border-top:1px solid #E3EAF3}
.sc-painel-top h4{margin:0;font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
/* ação secundária dentro de um painel: só ícone + texto, sem moldura */
.btn-nova-camp{display:inline-flex;align-items:center;gap:7px;padding:6px 2px;
  font-size:13px;font-weight:600;color:var(--primary);transition:.12s}
.btn-nova-camp:hover{text-decoration:underline}
.btn-nova-camp svg{flex-shrink:0}
.sc-vazio{margin:0;font-size:13.5px;color:var(--ink-3);line-height:1.5;background:#FAFCFE;
  border:1px solid #E3EAF3;border-radius:10px;padding:20px 22px}

/* Mesmo tratamento das faixas de DNA: a que está viva fica branca e legível,
   as encerradas recuam para o fundo. Sem cor de contorno — o contraste basta. */
/* Colunas fixas para os cards ficarem alinhados entre si */
.cpc{display:grid;grid-template-columns:minmax(200px,1fr) 150px 158px 150px 34px;gap:16px;align-items:center;
  background:#FAFCFE;border:1px solid #E3EAF3;border-radius:10px;padding:15px 18px;margin-bottom:10px;transition:.14s}
.cpc:last-child{margin-bottom:0}
.cpc.ativa{background:#fff;border-color:var(--border)}
.cpc-datas{min-width:0}
.cpc-per{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;font-weight:600;color:var(--ink-4)}
.cpc.ativa .cpc-per{color:var(--ink)}
.cpc-tag{font-size:11px;font-weight:600;background:var(--primary-soft);color:#0B6FD0;border-radius:999px;padding:3px 10px}
.cpc-criada{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:12.5px;color:var(--ink-4)}
.cpc.ativa .cpc-criada{color:var(--ink-3)}
.cpc-col{min-width:0}
.cpc-canal{display:flex}
.vdado{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
  color:var(--ink-3);white-space:nowrap;transition:.14s}
.cpc.ativa .vdado{font-weight:700;color:var(--ink)}
.vdado svg{color:#B9C8DA;flex-shrink:0}
.cpc.ativa .vdado svg{color:var(--ink-4)}
/* ação de segundo plano: só o ícone, o card inteiro já diz do que se trata */
.btn-res{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;
  color:var(--ink-4);background:transparent;transition:.12s;justify-self:end}
.btn-res:hover{background:var(--primary-soft);color:var(--primary)}
.btn-res:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.opc{font-size:11.5px;font-weight:500;color:var(--ink-4);background:#EDF1F6;border-radius:999px;padding:2px 8px;margin-left:4px}

/* ---------- Tela de resultados da campanha ---------- */
.res-topo{margin-bottom:18px}
.btn-voltar{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;
  color:var(--ink-3);padding:6px 2px;margin-bottom:14px;transition:.12s}
.btn-voltar:hover{color:var(--primary)}
.res-linha{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.res-per{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3)}
.res-selo{font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 11px}
.res-selo.sa{background:var(--primary-soft);color:#0B6FD0}
.res-selo.sp{background:var(--warn-bg);color:var(--warn-ink)}
.res-selo.se{background:#EDF1F6;color:var(--ink-3)}
.res-selo.sf{background:#EDF1F6;color:var(--ink-3)}
.res-tit{margin:0 0 6px;font-size:24px;font-weight:700;line-height:1.25;color:var(--ink)}
.res-sub{margin:0;font-size:13.5px;color:var(--ink-3)}

/* Veredito: mesma casca dos demais blocos (.bloco cuida de fundo, borda, raio e
   sombra). O que o destaca é só o corpo de texto maior — sem traço lateral, que
   nesta interface significa alerta e aqui era ruído. */
.res-veredito{font-size:17px;line-height:1.5;color:var(--ink-2)}
.res-veredito b{color:var(--ink);font-weight:700}

.res-parcial{display:flex;gap:11px;align-items:flex-start;background:var(--warn-bg);
  border:1px solid var(--warn-border);border-radius:10px;padding:13px 16px;margin:14px 0 0;
  font-size:13.5px;line-height:1.5;color:var(--warn-ink)}
.res-parcial svg{flex-shrink:0;margin-top:1px}
.res-parcial b{font-weight:700}

/* Três heróis, todos com o mesmo peso. O valor é o maior texto da tela. */
.herois{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.hero{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px 22px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}
.hero-rot{font-size:13px;font-weight:600;color:var(--ink-2)}
.hero-val{font-size:31px;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.01em}
.hero-ap{font-size:13px;color:var(--ink-3)}
.dlt{margin-top:5px;font-size:12.5px;font-weight:600}
.dlt.up{color:var(--green)}
.dlt.down{color:var(--danger)}
.dlt.flat{color:var(--ink-4)}

/* Ressalva de rodapé: vale para a página inteira, então fecha a página. */
.nota-inc{display:flex;gap:11px;align-items:flex-start;background:transparent;border:1px dashed var(--border-strong);
  border-radius:10px;padding:14px 17px;margin:4px 0 14px;font-size:13px;line-height:1.55;color:var(--ink-3)}
.nota-inc svg{flex-shrink:0;margin-top:2px;color:var(--ink-4)}
.nota-inc b{color:var(--ink-2);font-weight:600}

.bloco{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px 22px;
  box-shadow:var(--shadow);margin-bottom:14px}
.bloco-vazio{background:#FAFCFE;box-shadow:none}
.bloco-tit{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--ink-2)}
.bloco-nota{margin:14px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink-4)}
.bloco-vazio .bloco-nota{margin-top:0;font-size:13.5px;color:var(--ink-3)}

/* Barra horizontal, escala única: comparar entre campanhas é o ponto. */
.barras{display:flex;flex-direction:column;gap:9px}
.bar-lin{display:grid;grid-template-columns:170px 1fr 120px;gap:14px;align-items:center}
.bar-rot{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-lin.atual .bar-rot{color:var(--ink);font-weight:600}
.bar-rot i{font-style:normal;color:var(--primary);font-weight:600}
.bar-trilho{height:22px;background:#F1F5F9;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:#CBDCF0;border-radius:5px}
.bar-lin.atual .bar-fill{background:var(--primary)}
.bar-val{font-size:13.5px;color:var(--ink-2);text-align:right}
.bar-lin.atual .bar-val{font-weight:700;color:var(--ink)}

/* ---------- Funil ----------
   Duas decisões de alinhamento que estavam quebradas antes:

   1. O recuo do ramo e a coluna de rótulo tinham que fechar a conta. Com
      recuo 42px e rótulo 208px contra 230px do pai, o trilho do ramo começava
      20px fora do trilho de cima. Agora é uma variável só: --fun-rot menos
      --fun-ind dá a coluna do ramo, e os quatro trilhos nascem no mesmo x.
   2. O bloco encostava na borda do card. Ganhou respiro em cima e embaixo. */
.funil-camp{--fun-rot:236px; --fun-ind:32px; --fun-val:150px;
  display:flex;flex-direction:column;gap:11px;margin:2px 0 18px}
.fun-lin{display:grid;grid-template-columns:var(--fun-rot) minmax(0,1fr) var(--fun-val);
  gap:20px;align-items:center}
.fun-rot{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.fun-trilho{height:34px;background:#EFF4F9;border-radius:9px;overflow:hidden}
.fun-fill{height:100%;border-radius:9px;background:var(--primary);min-width:6px;
  transition:width .25s ease}
.fun-lin.d1 .fun-fill{background:linear-gradient(90deg,#DCE7F4,#CCDDEF)}
.fun-lin.d2 .fun-fill{background:linear-gradient(90deg,#2D8FFC,var(--primary))}
.fun-lin.d3 .fun-trilho{height:28px;border-radius:8px}
.fun-lin.d3 .fun-fill{background:#93C3F5;border-radius:8px}
.fun-lin.d3 .fun-rot{font-size:13px;color:var(--ink-3)}
.fun-val{text-align:right}
.fun-val b{display:block;font-size:18px;font-weight:700;color:var(--ink);line-height:1.15;
  font-variant-numeric:tabular-nums}
.fun-val span{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}
.fun-lin.d3 .fun-val b{font-size:16px;color:var(--ink-2)}

/* Legenda de base: cada trecho declara sobre o que a barra está medindo. */
.fun-base{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:-3px}

/* Ramo: recuo com um fio de árvore em vez de uma borda grossa colada no texto.
   O fio para antes do fim da última linha, como conector — não como divisória. */
.fun-ramo{position:relative;padding-left:var(--fun-ind);margin-top:5px;
  display:flex;flex-direction:column;gap:11px}
.fun-ramo::before{content:'';position:absolute;left:11px;top:0;bottom:20px;
  width:1px;background:var(--border-strong)}
.fun-ramo .fun-lin{grid-template-columns:calc(var(--fun-rot) - var(--fun-ind)) minmax(0,1fr) var(--fun-val)}
.fun-ramo .fun-rot{position:relative}
.fun-ramo .fun-rot::before{content:'';position:absolute;left:calc(-1 * var(--fun-ind) + 11px);
  top:50%;width:14px;height:1px;background:var(--border-strong)}
.fun-ramo .fun-base{margin-left:calc(-1 * var(--fun-ind) + 25px)}

/* Comparação de ticket: três colunas de mesmo peso, a leitura é lado a lado. */
.tkcmp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tk-col{background:#FAFCFE;border:1px solid var(--border);border-radius:10px;padding:15px 17px}
.tk-col span{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:6px;line-height:1.4}
.tk-col b{display:block;font-size:22px;font-weight:700;color:var(--ink);line-height:1.2}
.tk-col b.pos{color:var(--green)}
.tk-col b.neg{color:var(--danger)}
.tk-col i{display:block;font-style:normal;font-size:12px;color:var(--ink-4);margin-top:5px;line-height:1.4}

.retorno{display:flex;align-items:center;gap:30px;flex-wrap:wrap}
.ret-num b{display:block;font-size:31px;font-weight:700;color:var(--ink);line-height:1.15}
.ret-num span{display:block;font-size:13px;color:var(--ink-3);margin-top:3px}
.ret-lado{display:flex;gap:26px;flex-wrap:wrap;padding-left:30px;border-left:1px solid var(--border)}
.ret-lado span{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:3px}
.ret-lado b{display:block;font-size:17px;font-weight:700;color:var(--ink-2)}

@media(max-width:1080px){
  .herois{grid-template-columns:1fr}
  .tkcmp{grid-template-columns:1fr}
  .bar-lin{grid-template-columns:120px 1fr 100px;gap:10px}
  .funil-camp{--fun-rot:160px; --fun-ind:22px; --fun-val:108px}
  .fun-lin{gap:12px}
}

.maiswrap{position:relative;z-index:20;flex-shrink:0}
.mais{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.12s;color:var(--ink-3)}
.mais:hover{background:#EDF1F6;color:var(--ink)}
.mais.on{background:#E2E8F0;color:var(--ink)}
.segmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;min-width:196px;background:#fff;
  border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 12px 32px rgba(15,35,60,.16);padding:6px;overflow:hidden}
.segmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:7px;
  font-size:13px;color:var(--ink-2);text-align:left;transition:.1s}
.segmenu button svg{flex:0 0 15px;color:var(--ink-4)}
.segmenu button:hover{background:#F1F5F9;color:var(--ink)}
.segmenu button:hover svg{color:var(--ink-2)}
.segmenu button.perigo{color:var(--danger)}
.segmenu button.perigo svg{color:var(--danger)}
.segmenu button.perigo:hover{background:var(--danger-soft);color:var(--danger)}

/* pills de canal */
.canal{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap}
.canal svg{flex-shrink:0;opacity:.85}
.ca-email{background:#E6F1FB;color:#0C447C}
.ca-zap{background:#E1F5EE;color:#085041}
.ca-tel{background:#EEEDFE;color:#3C3489}
.ca-sms{background:#FAEEDA;color:#854F0B}

/* modal de campanha */
.mc-secao{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink)}
.mc-datas{display:flex;gap:16px;flex-wrap:wrap}
.mc-datas .field{flex:1;min-width:180px;margin-bottom:0}
.mc-canais{display:flex;gap:9px;flex-wrap:wrap}
.mc-canal{border:1px solid var(--border-strong);background:#fff;border-radius:9px;padding:9px 11px;transition:.12s}
.mc-canal:hover{border-color:var(--primary)}
.mc-canal.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.mc-canal:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

@media(max-width:980px){
  .sc-topo{flex-direction:column;align-items:stretch;gap:18px}
  .sc-kpis{flex-wrap:wrap}
  .kbox{flex:1;min-width:140px}
  .maiswrap{position:absolute;top:18px;right:18px}
  .segcard{position:relative}
}
@media(max-width:900px){
  .cpc{grid-template-columns:1fr 1fr;gap:12px 16px}
  .cpc-datas{grid-column:1 / -1}
  .btn-res{grid-column:2;justify-self:end}
}
@media(max-width:520px){
  .cpc{grid-template-columns:1fr auto}
}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,40,70,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:568px;padding:26px 28px;box-shadow:0 18px 50px rgba(15,40,70,.22)}
.modal h2{margin:0 0 20px;font-size:20px;font-weight:700}
.modal .field{margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center}

/* ---------- Modal: salvar segmentação ---------- */
.modal-salvar{max-width:600px;padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.ms-head{padding:24px 28px 18px;border-bottom:1px solid var(--border)}
.ms-head h2{margin:0 0 6px;font-size:20px;font-weight:700}
.ms-head p{margin:0;font-size:13px;color:var(--ink-3);line-height:1.5}
.ms-corpo{padding:20px 28px 4px;overflow-y:auto;flex:1}

/* resumo: confirmação rápida, não uma etapa nova — por isso caixa chapada e fonte pequena */
.rm{border:1px solid var(--border);border-radius:10px;margin-bottom:24px;overflow:hidden;background:#fff}
.rm-head{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#F5F8FC;
  border-bottom:1px solid var(--border);font-size:12px;font-weight:600;color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.05em}
.rm-head svg{color:var(--ink-4)}
.rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.rm-item{display:flex;flex-direction:column;gap:2px;padding:11px 16px;min-width:0;
  border-bottom:1px solid var(--border)}
.rm-grid .rm-item:nth-child(odd){border-right:1px solid var(--border)}
.rm-grid .rm-item:nth-last-child(-n+2){border-bottom:0}

.ms-form .field{margin-bottom:20px}

.ms-erro{margin:0 0 20px}

.ttip{position:relative;display:inline-flex;color:var(--ink-4);cursor:help}
.ttip:hover{color:var(--primary)}
.ttip .bubble{

const FAIXAS = ['18 - 25','26 - 35','36 - 45','46 - 55','56 - 65','+65','Não definido'];

/* Pesos por faixa. Numa base de farmácia o 56-65 e o +65 pesam — é onde está
   o medicamento contínuo. Uma curva enviesada para jovens deixaria essas
   faixas com quase ninguém e o filtro pareceria quebrado no teste. */
const PESO_FAIXA = [.11, .19, .21, .19, .15, .09, .06];
function sorteiaFaixa(r){
  let acc = 0;
  for(let i=0;i<FAIXAS.length;i++){ acc += PESO_FAIXA[i]; if(r < acc) return FAIXAS[i]; }
  return FAIXAS[FAIXAS.length-1];
}

function rfvSorteio(){
  let r = rnd(), acc = 0;

  return 'ocasional';
}

  const janelaFim = rfv==='abandonador' ? 200 + rnd()*380 : rfv==='novo' ? rnd()*60 : rnd()*45;
  const compras = [];
  const lojaBase = Math.floor(rnd()*LOJAS.length);
  for(let c=0;c<nCompras;c++){
    const d = new Date(HOJE.getTime() - (janelaFim + c*between(14,52))*DIA);
    if(d.getTime() < HOJE.getTime() - 730*DIA) break;
    compras.push({ dt:d.getTime(), loja: rnd()<.82 ? lojaBase : Math.floor(rnd()*LOJAS.length), prod: Math.floor(rnd()*PRODUTOS.length) });
  }
  if(!compras.length) compras.push({dt:HOJE.getTime()-Math.floor(rnd()*300)*DIA, loja:lojaBase, prod:Math.floor(rnd()*PRODUTOS.length)});
  const dna = {};
  const principais = [];
  const nDna = 1 + Math.floor(rnd()*2.6);
  while(principais.length < nDna){ const d = pick(DNAS).id; if(!principais.includes(d)) principais.push(d); }
  /* Aderência por DNA. A curva é enviesada de propósito: entre os DNAs principais
     do cliente, poucos chegam ao topo. Com uma distribuição uniforme, as faixas
     Média e Alta saíam do mesmo tamanho e "Alta aderência" deixava de significar
     um grupo seleto — o que quebra o conceito na hora do teste com usuário. */
  DNAS.forEach(d => {
    dna[d.id] = principais.includes(d.id)
      ? .45 + .55*Math.pow(rnd(), 2.5)   // pirâmide: muita Média, pouca Alta
      : between(0, .42);                 // demais DNAs: entre nada e Baixa
  });
  const ticket = rfv==='valioso'?between(180,420) : rfv==='fiel'?between(90,190) : between(28,130);
  return {
    id:i, rfv,
    genero: rnd()<.58?'F':rnd()<.93?'M':'N',
    faixa: sorteiaFaixa(rnd()),
    ticket, freq: compras.length, ltv: ticket*compras.length*between(.8,1.5),
    compras, dna,
    lojas:[...new Set(compras.map(c=>c.loja))],
    prods:[...new Set(compras.map(c=>c.prod))]
  };
});

/* ---------- Períodos fechados de compra (etapa Produtos) ----------
   Semanas: segunda a domingo, apenas semanas já encerradas.
   Meses:   meses de calendário já encerrados, montados a partir do histórico. */
const dd = n => String(n).padStart(2,'0');
const meiaNoite = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const HOJE_MS = meiaNoite(HOJE).getTime();

/* Segunda-feira da semana que contém a data. */
function segundaDe(d){
  const x = meiaNoite(d);
  return new Date(x.getTime() - ((x.getDay()+6)%7)*DIA);
}
/* Objeto período a partir de qualquer data dentro da semana. */
function semanaDe(d){
  const ini = segundaDe(d), fim = new Date(ini.getTime()+6*DIA);
  return {
    tipo:'semana', chave:'w:'+ymd(ini),
    rotulo:`${dd(ini.getDate())}/${dd(ini.getMonth()+1)} a ${dd(fim.getDate())}/${dd(fim.getMonth()+1)}`,
    nota: MESES[fim.getMonth()].slice(0,3)+'/'+String(fim.getFullYear()).slice(2),
    ini: ini.getTime(), fim: fim.getTime()+DIA-1
  };
}
function mesDe(ano,mes){
  const ini = new Date(ano,mes,1), fim = new Date(ano,mes+1,0);
  return {
    tipo:'mes', chave:'m:'+ano+'-'+dd(mes+1),
    rotulo: MESES[mes].charAt(0).toUpperCase()+MESES[mes].slice(1),
    nota: String(ano),
    ini: ini.getTime(), fim: fim.getTime()+DIA-1
  };
}
/* Só períodos JÁ FECHADOS e dentro da janela de análise ficam clicáveis —
   assim ninguém compara um mês pela metade com um mês inteiro. */
function periodoFechado(p){ return p.fim < HOJE_MS && p.ini >= JANELA_INI; }

function periodoDaChave(k){
  if(!k) return null;
  if(k[0]==='w') return semanaDe(parseYmd(k.slice(2)));
  const [a,m] = k.slice(2).split('-').map(Number);
  return mesDe(a, m-1);
}
function periodosEscolhidos(){
  return S.compraPeriodos.map(periodoDaChave).filter(Boolean).sort((x,y)=>x.ini-y.ini);
}
function rotuloPeriodo(p){
  return p.tipo==='semana' ? `${p.rotulo} (${p.nota})` : `${p.rotulo} de ${p.nota}`;
}
function resumoPeriodos(){
  const p = periodosEscolhidos();
  if(!p.length) return '';
  return p.length===1 ? rotuloPeriodo(p[0]) : p.length+' períodos escolhidos';
}
/* Limites de navegação do calendário. */
const ANO_MIN = new Date(JANELA_INI).getFullYear();
const ANO_MAX = HOJE.getFullYear();

function calcular(){
  const a = JANELA_INI, b = JANELA_FIM;
  const dentro = c => c.compras.filter(x => x.dt>=a && x.dt<=b);

  let base = [];
  for(const c of CLIENTES){ const cp = dentro(c); if(cp.length) base.push({c,cp}); }
  const baseN = base.length || 1;

  // filtros nomeados, na MESMA ordem das etapas do fluxo —
  // permitem montar o funil e diagnosticar quem zerou o público
  // Com marcação múltipla, cada grau vira uma FAIXA fechada, não um mínimo.
  // Antes "Média" queria dizer "0,45 pra cima" e já engolia a Alta; agora
  // Média é só a faixa do meio, e quem quiser as duas marca as duas.
  // DNA ligado entra no filtro mesmo sem faixa marcada — e aí não traz ninguém,
  // que é exatamente o que os três switches desligados dizem na tela.
  const dnaSel = Object.keys(S.dna);
  const filtros = [];
  // Lojas entra SEMPRE: como o padrão é tudo marcado, desmarcar é um recorte de verdade.
  // Nenhuma loja marcada = nenhum cliente (e não "todas", que seria o oposto do que o clique diz).
  { const set = new Set(S.lojas);
    filtros.push(['Lojas', o=>o.cp.some(x=>set.has(LOJAS[x.loja].id)), 'Lojas']); }
  if(S.rfv.length)    filtros.push(['Perfil (RFV)', o=>S.rfv.includes(o.c.rfv), 'Perfil RFV']);
  if(dnaSel.length){
    const testa=(o,d)=>{ const v=o.c.dna[d];
      return S.dna[d].some(g=>{ const f=FAIXA_ADER[g]; return v>=f[0] && v<f[1]; }); };
    filtros.push(['DNA', OPTS.dnaLogic==='AND' ? o=>dnaSel.every(d=>testa(o,d)) : o=>dnaSel.some(d=>testa(o,d)), 'DNA']);
  }
  if(S.genero.length) filtros.push(['Gênero', o=>S.genero.includes(o.c.genero), 'Demográfico']);
  if(S.faixa.length)  filtros.push(['Faixa etária', o=>S.faixa.includes(o.c.faixa), 'Demográfico']);
  // Produtos + período de compra formam UM critério só:
  // a mesma compra precisa ser do produto marcado E ter acontecido no período escolhido.
  const janelas = periodosEscolhidos();
  if(S.produtos.length || janelas.length){
    const set = S.produtos.length ? new Set(S.produtos) : null;
    const nome = S.produtos.length && janelas.length ? 'Produtos no período'
               : janelas.length ? 'Período de compra' : 'Produtos';
    filtros.push([nome, o=>o.cp.some(x =>
      (!set || set.has(PRODUTOS[x.prod].id)) &&
      (!janelas.length || janelas.some(p => x.dt>=p.ini && x.dt<=p.fim))
    ), 'Produtos']);
  }

  const aplicar = pular => base.filter(o => filtros.every((f,i)=> i===pular || f[1](o)));
  let out = aplicar(-1);

  // ---- funil: quantos clientes sobram depois de cada etapa ----
  const funil = [{etapa:'Base de clientes', clientes: Math.round(baseN*SCALE), corte:0, primeiro:true}];
  let atual = base, anterior = baseN;
  for(let i=0; i<filtros.length; i++){
    atual = atual.filter(filtros[i][1]);
    const etapa = filtros[i][2];
    const linha = {etapa, clientes: Math.round(atual.length*SCALE), corte: anterior ? 1 - atual.length/anterior : 0};
    const ult = funil[funil.length-1];
    if(ult.etapa === etapa){ // Demográfico soma gênero + faixa numa linha só
      ult.clientes = linha.clientes;
      ult.corte = 1 - atual.length/ult._ent;
    } else {
      linha._ent = anterior;
      funil.push(linha);
    }
    anterior = atual.length;
  }
  funil.forEach(f=>{ delete f._ent; f.pctBase = baseN ? f.clientes/(baseN*SCALE) : 0; });

  if(!out.length){
    // qual critério, se removido, devolve mais gente?
    let culpado = null, melhor = 0;
    filtros.forEach((f,i)=>{ const n = aplicar(i).length; if(n > melhor){ melhor = n; culpado = f[0]; } });
    let extra = '';
    if(!S.lojas.length)
      extra = 'Você desmarcou todas as lojas. Marque pelo menos uma para o público voltar a existir.';
    else if(culpado==='Período de compra' || culpado==='Produtos no período')
      extra = `Ninguém que atende aos outros critérios comprou ${S.produtos.length?'esses produtos ':''}nos períodos escolhidos. Tente marcar mais períodos${S.produtos.length?' ou mais produtos':''}.`;
    else if(dnaSel.length>1 && OPTS.dnaLogic==='AND' && culpado==='DNA')
      extra = `Você pediu clientes que se encaixam em <b>todos</b> os ${dnaSel.length} DNAs ao mesmo tempo. Isso é raro — tente um DNA de cada vez ou marque mais faixas de aderência.`;
    return {vazio:'sem-resultado', culpado, recupera: Math.round(melhor*SCALE), extra,
      unico: filtros.length===1, criterios: filtros.map(f=>f[0]), funil};
  }

  const n = out.length;
  const fat = out.reduce((s,o)=> s + o.c.ticket*o.cp.length, 0) * SCALE;
  return {
    clientes: Math.round(n*SCALE),
    pct: n/baseN,
    faturamento: fat,
    ticket: out.reduce((s,o)=>s+o.c.ticket,0)/n,
    ltv: out.reduce((s,o)=>s+o.c.ltv,0)/n,
    prods: S.produtos.length,
    funil
  };
}

// A estimativa NUNCA recalcula sozinha: só no clique em "Atualizar estimativa".
// Qualquer mudança de critério marca o card como desatualizado.
function marcarSujo(motivo){
  if(!S.stale) log('estimativa-desatualizada', motivo||'');
  S.stale = true;
  S.pendentes++;
  render();
}
function recalcular(motivo){
  S.calculando = true; S.stale = false; render();
  log('recalculo', motivo+' · '+S.pendentes+' mudança(s)');
  S.pendentes = 0;
  setTimeout(()=>{ S.estimativa = calcular(); S.calculando = false; render(); }, 700);
}

const CANAIS = {

const pillCanal = k => { const [rot,cls,ic] = CANAIS[k] || ['Outro','ca-email','mail'];
  return `<span class="canal ${cls}">${I[ic]} ${rot}</span>`; };
const brDate = d => parseYmd(d.split('/').reverse().join('-'));

/* "R$ 2.500,00" → 2500. O ponto é separador de milhar e a vírgula é decimal;
   trocar vírgula por ponto sem tirar os milhares dá NaN. */
function parseBrl(txt){
  const limpo = String(txt||'').replace(/[^\d,.-]/g,'');
  if(!limpo) return 0;
  const n = Number(limpo.replace(/\./g,'').replace(',','.'));
  return isFinite(n) && n>0 ? n : 0;
}
const campanhaAtiva = c => brDate(c.ini) <= HOJE && brDate(c.fim) >= HOJE;

/* Faturamento e ticket do card vêm SEMPRE das campanhas: o card mestre é a
   soma do que as campanhas realizaram, não um número guardado à parte.

   TICKET: média PONDERADA, não média das médias. Somar os tickets e dividir
   pelo número de campanhas dá o mesmo peso a uma campanha de 4.581 compras e a
   uma de 320 — e sempre puxa o resultado para a campanha pequena. O certo é
   faturamento total ÷ total de compras. Na s1 a diferença é R$ 101,08 (errado)
   contra R$ 102,07 (certo); com campanhas de tamanhos mais distantes, cresce. */
function totaisSeg(s){
  const c = s.campanhas || [];
  const faturamento = c.reduce((a,x)=>a+(x.faturamento||0),0);
  const compras = c.reduce((a,x)=>a+(x.compras||0),0);
  const ticket = compras ? faturamento/compras : 0;
  const emAndamento = c.filter(campanhaAtiva).length;
  return {faturamento, compras, ticket, realizadas:c.length, emAndamento};
}

/* ---------- Estado de uma campanha no tempo ----------
   Três situações que a tela precisa distinguir, porque cada uma pede um texto
   diferente. Confundir "ainda não começou" com "não vendeu nada" faz o associado
   concluir que a campanha fracassou no dia em que ela nasceu. */
function faseCampanha(c){
  const ini = brDate(c.ini), fim = brDate(c.fim);
  if(ini > HOJE)  return 'futura';
  if(fim >= HOJE) return 'andamento';
  // janela de atribuição: 7 dias de rabo depois do fim
  return addDias(fim,7) >= HOJE ? 'apurando' : 'encerrada';
}
const JANELA_RABO = 7;

/* Retorno só existe com investimento informado. faturamento ÷ 0 dá Infinity,
   e três das dez campanhas de exemplo estão com investimento zerado. */
function retornoCamp(c){
  return c.investimento > 0 ? c.faturamento / c.investimento : null;
}

/* Campanhas anteriores da MESMA segmentação, da mais recente para a mais antiga.
   É a única base de comparação honesta que temos: mesmo público, mesma régua. */
function anterioresDe(s, c){
  return (s.campanhas||[])
    .filter(x => x.id !== c.id && brDate(x.ini) < brDate(c.ini) && x.compras > 0)
    .sort((a,b) => brDate(b.ini) - brDate(a.ini));
}

  return `<div class="segcard ${aberto?'aberto':''}">

        <p class="obj">${esc(s.objetivo)}</p>

    <button class="sc-rodape ${aberto?'on':''}" data-act="abrirCampanhas" data-v="${s.id}" aria-expanded="${aberto}">
      <span class="sc-filtros">${I.funnel} <i>Filtros aplicados:</i>
        ${filtro('Perfil RFV', s.rfv)}${filtro('DNA', s.dna)}${filtro('Demográfico', s.demo)}</span>
      <span class="sc-camps-res">${I.megafone} <i>Campanhas:</i>
        <span class="fpill">Realizadas: <b>${t.realizadas}</b></span>
        <span class="fpill ${t.emAndamento?'viva':''}">Em andamento: <b>${t.emAndamento}</b></span>
        <i class="sc-caret ${aberto?'on':''}">${I.chev}</i></span>
    </button>

    ${aberto?`<div class="sc-painel">
      <div class="sc-painel-top">
        <h4>Campanhas</h4>
        <button class="btn-nova-camp" data-act="abrirModalCamp" data-v="${s.id}">${I.plus} Criar campanha</button>
      </div>
      ${(s.campanhas||[]).length
        ? s.campanhas.map(c=>cardCampanha(s,c)).join('')
        : `<p class="sc-vazio">Nenhuma campanha ainda. Crie a primeira para começar a medir o desempenho desse público.</p>`}
    </div>`:''}
  </div>`;
}

/* =========================================================================
   5b. TELA: RESULTADOS DA CAMPANHA
   -------------------------------------------------------------------------
   Uma pergunta só: "esta campanha vendeu mais do que custou, e foi melhor que
   a anterior?". Quem lê é dono de farmácia, não analista.

   Três números-herói, não quatro. O retorno desceu para o nível 2 porque
   depende de `investimento`, que é campo livre e opcional na criação — herói
   que fica vazio em metade das telas não é herói.

   O que esta tela NÃO faz (e por quê está na spec, não no código): funil de
   entrega, linha do tempo diária, quebra por loja/produto/perfil. Tudo isso
   depende de dado que ninguém confirmou que existe. Desenhar agora seria
   validar em teste uma tela que talvez não dê para construir.
   ========================================================================= */

/* Comparação é o que torna um número legível. "9,7% de conversão" não diz nada;
   "acima da campanha anterior" diz. Só compara quando há com o que comparar. */
function delta(atual, ant){
  if(!ant) return null;   // sem base de comparação não se inventa seta
  const p = (atual - ant) / ant * 100;
  return { pct: p, dir: p > 0.5 ? 'up' : (p < -0.5 ? 'down' : 'flat') };
}
function selo(d, sufixo){
  if(!d) return '';
  const seta = d.dir==='up' ? '▲' : (d.dir==='down' ? '▼' : '=');
  const txt = d.dir==='flat' ? 'igual à anterior'
    : `${seta} ${nf1.format(Math.abs(d.pct))}% ${d.dir==='up'?'acima':'abaixo'} da ${sufixo}`;
  return `<span class="dlt ${d.dir}">${txt}</span>`;
}

/* A frase que resume tudo. Se o associado ler só isto e fechar a tela, ele já
   sabe o que precisava saber. Achado vira insight quando cabe numa frase. */
function veredito(s, c, ant){
  const fase = faseCampanha(c);
  if(fase==='futura')
    return `Esta campanha começa em <b>${c.ini}</b>. Os resultados aparecem aqui a partir dessa data.`;
  if(!c.compras)
    return `Ainda não há compra registrada neste público desde o início da campanha. ${
      fase==='andamento' ? 'A campanha segue no ar até '+c.fim+'.' : ''}`;

  const base = `Esta campanha trouxe <b>${brl(c.faturamento)}</b> em vendas de <b>${nf.format(c.clientesComp)}</b> clientes`;
  if(!ant) return `${base}. É a primeira campanha deste público — a partir da próxima dá para comparar.`;
  const d = delta(c.faturamento, ant.faturamento);
  const cmp = d.dir==='flat' ? 'praticamente o mesmo faturamento da campanha anterior'
    : `<b>${nf1.format(Math.abs(d.pct))}% ${d.dir==='up'?'a mais':'a menos'}</b> que a campanha anterior deste público`;
  return `${base} — ${cmp}.`;
}

function heroi(rot, valor, apoio, dlt){
  return `<div class="hero">
    <span class="hero-rot">${rot}</span>
    <b class="hero-val">${valor}</b>
    ${apoio ? `<span class="hero-ap">${apoio}</span>` : ''}
    ${dlt || ''}
  </div>`;
}

/* Barra horizontal: comparação de categorias com rótulo longo. Escala única
   para todas as barras — escala por barra mentiria sobre o tamanho relativo. */
function barrasHistorico(s, c){
  const todas = (s.campanhas||[]).filter(x=>x.compras>0)
    .sort((a,b)=>brDate(b.ini)-brDate(a.ini)).slice(0,5);
  if(todas.length < 2) return '';
  const teto = Math.max(...todas.map(x=>x.faturamento));
  return `<div class="bloco">
    <h4 class="bloco-tit">Comparado às outras campanhas deste público</h4>
    <div class="barras">
      ${todas.map(x=>{
        const atual = x.id===c.id;
        return `<div class="bar-lin ${atual?'atual':''}">
          <div class="bar-rot">${x.ini.slice(0,5)} · ${CANAIS[x.canal][0]}${atual?' <i>(esta)</i>':''}</div>
          <div class="bar-trilho"><div class="bar-fill" style="width:${(x.faturamento/teto*100).toFixed(1)}%"></div></div>
          <div class="bar-val">${brl(x.faturamento)}</div>
        </div>`;
      }).join('')}
    </div>
    <p class="bloco-nota">Mesma escala em todas as barras. Só campanhas que já tiveram resultado aparecem aqui.</p>
  </div>`;
}

/* ---------- Funil: do público até a compra de qualidade ----------
   ATENÇÃO À ESTRUTURA. Funil só não mente quando cada degrau é subconjunto
   estrito do de cima. "Gastou acima do normal" e "voltou uma segunda vez" são
   dois subconjuntos IRMÃOS de "comprou": dá para voltar a comprar gastando
   pouco, e dá para gastar muito numa compra só. Empilhar os quatro em fila
   sugeriria que o quarto está dentro do terceiro, o que é falso e faria o
   associado ler o número final como "só 69 chegaram até o fim".

   Por isso o desenho é uma bifurcação, não uma fila: dois degraus em cadeia e,
   a partir de "compraram", dois ramos lado a lado com recuo. */
function funilCampanha(s, c){
  const total = s.clientes || 0;
  if(!total || !c.clientesComp) return '';
  const pct  = n => total ? n/total*100 : 0;
  const dosQ = n => c.clientesComp ? Math.round(n/c.clientesComp*100) : 0;

  const acima   = c.clientesAcima || 0;
  const recompra= c.clientesRecompra || 0;
  const pctAcima = dosQ(acima);
  const base = s.pctAcimaHist || 0;
  const dif  = pctAcima - base;

  /* A barra desenha SEMPRE a mesma fração que o rótulo declara.
     Antes o ramo dizia "46% de quem comprou" e desenhava 4% — porque a barra
     usava o público como base e o texto usava quem comprou. Barra que contradiz
     o próprio rótulo é pior que não ter barra. Agora a base vai junto: cadeia
     mede sobre o público, ramo mede sobre quem comprou, e cada um declara. */
  const degrau = (rot, n, largura, apoio, cls) => `<div class="fun-lin ${cls}">
    <div class="fun-rot">${rot}</div>
    <div class="fun-trilho"><div class="fun-fill" style="width:${largura.toFixed(1)}%"></div></div>
    <div class="fun-val"><b>${nf.format(n)}</b><span>${apoio}</span></div>
  </div>`;

  return `<div class="bloco">
    <h4 class="bloco-tit">Do público até a compra</h4>
    <div class="funil-camp">
      <div class="fun-base">Sobre o público inteiro</div>
      ${degrau('Receberam a campanha', total, 100, '100% do público', 'd1')}
      ${degrau('Compraram', c.clientesComp, pct(c.clientesComp), `${Math.round(pct(c.clientesComp))}% do público`, 'd2')}
      <div class="fun-ramo">
        <div class="fun-base">Sobre os ${nf.format(c.clientesComp)} que compraram</div>
        ${degrau('Gastaram acima do normal', acima, dosQ(acima), `${pctAcima}% de quem comprou`, 'd3')}
        ${degrau('Voltaram uma segunda vez', recompra, dosQ(recompra), `${dosQ(recompra)}% de quem comprou`, 'd3')}
      </div>
    </div>
    <p class="bloco-nota">Os dois últimos saem de quem comprou e <b>não se somam</b>: o mesmo cliente
    pode estar nos dois, ou em nenhum. “Acima do normal” é gastar mais de ${brl(s.ticketHist||0)} por
    compra, que é o que este público costuma gastar.</p>
  </div>`;
}

/* Contexto que faz o número acima significar alguma coisa.
   Numa distribuição de ticket, que é torta para a direita, cerca de 35% a 40%
   das compras já ficam acima da média em mês NORMAL. Mostrar "46% acima" sem
   dizer que o normal é 38% faria qualquer campanha parecer um sucesso. */
function blocoTicket(s, c){
  if(!c.clientesComp) return '';
  const ticket = c.compras ? c.faturamento/c.compras : 0;
  const hist = s.ticketHist || 0;
  const pctAcima = Math.round((c.clientesAcima||0)/c.clientesComp*100);
  const base = s.pctAcimaHist || 0;
  const dif = pctAcima - base;
  const dTk = hist ? (ticket-hist)/hist*100 : 0;
  const bom = dif > 2, ruim = dif < -2;

  return `<div class="bloco">
    <h4 class="bloco-tit">Estamos aumentando o ticket deste público?</h4>
    <div class="tkcmp">
      <div class="tk-col">
        <span>Ticket nesta campanha</span>
        <b class="${dTk>1?'pos':(dTk<-1?'neg':'')}">${brl(ticket)}</b>
        <i>${dTk>1?'acima':(dTk<-1?'abaixo':'em linha com')} do normal do público</i>
      </div>
      <div class="tk-col">
        <span>O que este público costuma gastar</span>
        <b>${brl(hist)}</b>
        <i>média por compra fora de campanha</i>
      </div>
      <div class="tk-col">
        <span>Clientes que gastaram acima disso</span>
        <b class="${bom?'pos':(ruim?'neg':'')}">${pctAcima} em cada 100</b>
        <i>num período normal são ${base} em cada 100</i>
      </div>
    </div>
    <p class="bloco-nota">As duas leituras juntas importam: a média sobe se poucos clientes gastam
    muito, e a contagem mostra se o aumento foi de fato espalhado. ${
      bom  ? '<b>Aqui subiram as duas</b> — mais gente gastando mais, não só alguns.' :
      ruim ? '<b>Aqui a contagem caiu</b> — mesmo que a média tenha subido, menos gente passou do valor de sempre.' :
             'Aqui a contagem ficou perto do normal do público.'}</p>
  </div>`;
}

/* Investimento e retorno: nível 2, e com estado próprio quando não informado.
   Mostrar "R$ 0,00" seria dizer que a campanha foi de graça, o que é diferente
   de ninguém ter preenchido o campo. */
function blocoInvestimento(c){
  const r = retornoCamp(c);
  if(r === null) return `<div class="bloco bloco-vazio">
    <h4 class="bloco-tit">Retorno sobre o investimento</h4>
    <p class="bloco-nota">Nenhum investimento foi informado para esta campanha, então não dá para
    calcular o retorno. O valor é preenchido na criação da campanha.</p>
  </div>`;
  const cpc = c.clientesComp ? c.investimento / c.clientesComp : 0;
  return `<div class="bloco">
    <h4 class="bloco-tit">Retorno sobre o investimento</h4>
    <div class="retorno">
      <div class="ret-num"><b>R$ ${nf1.format(r)}</b><span>de venda para cada R$ 1 investido</span></div>
      <div class="ret-lado">
        <div><span>Investido</span><b>${brl(c.investimento)}</b></div>
        <div><span>Custo por cliente que comprou</span><b>${cpc?brl(cpc):'—'}</b></div>
      </div>
    </div>
    <p class="bloco-nota">O valor investido é informado por quem cria a campanha e não é conferido pelo sistema.</p>
  </div>`;
}

/* O aviso mais importante da tela. Sem grupo de controle, parte destas compras
   ia acontecer de qualquer jeito — é medicação contínua, recompra de fralda.
   O painel não tem como separar, e esconder isso ensina a conclusão errada. */
function avisoIncremental(){
  return `<div class="nota-inc">${I.info}
    <div><b>Este número não é só o que a campanha causou.</b>
    Parte destes clientes compraria mesmo sem receber a mensagem. Para separar as duas coisas
    seria preciso deixar uma parte do público sem receber nada e comparar os dois grupos.</div>
  </div>`;
}

function telaResultados(){
  const s = S.segmentacoes.find(x=>x.id===S.resSeg);
  const c = s && (s.campanhas||[]).find(x=>x.id===S.resCamp);
  // Sem tabs() e sem "Painel CRM": esta página é só o resultado de UMA campanha.
  // A navegação do painel não pertence aqui — o caminho de volta é o botão.
  if(!s || !c){
    return shell(`<div class="empty">${I.file}
      <h2>Campanha não encontrada</h2>
      <p>Ela pode ter sido removida. Volte para a lista de segmentações.</p>
      <button class="btn btn-primary" style="margin-top:20px" data-act="voltarLista">Voltar</button></div>`);
  }

  const fase = faseCampanha(c);
  const ant  = anterioresDe(s, c)[0] || null;
  const conv = s.clientes ? c.clientesComp / s.clientes * 100 : 0;
  const convAnt = ant && s.clientes ? ant.clientesComp / s.clientes * 100 : 0;
  // ticket sempre recalculado da mesma forma nos dois lados da comparação:
  // usar o campo guardado de um e a conta do outro daria seta errada
  const tk = x => x && x.compras ? x.faturamento / x.compras : 0;
  const ticket = tk(c), ticketAnt = tk(ant);

  const SELOS = {
    futura:    ['Ainda não começou','sf'],
    andamento: ['Em andamento','sa'],
    apurando:  ['Encerrada · ainda apurando','sp'],
    encerrada: ['Encerrada','se']
  };
  const [seloRot, seloCls] = SELOS[fase];

  // O aviso de parcial fica colado na identificação da campanha, não flutuando
  // entre os blocos de número: é uma condição do cabeçalho, não uma métrica.
  const parcial = (fase==='andamento' || fase==='apurando')
    ? `<div class="res-parcial">${I.alert}
        <div><b>Números parciais.</b> ${fase==='andamento'
          ? `A campanha vai até ${c.fim} e as compras continuam entrando.`
          : `A campanha terminou em ${c.fim}, mas ainda contamos as compras até ${fmtD(addDias(brDate(c.fim),JANELA_RABO).getTime())}.`}</div>
      </div>` : '';

  const cabecalho = `<div class="res-topo">
    <button class="btn-voltar" data-act="voltarLista">${I.back} Voltar para as segmentações</button>
    <div class="res-ident">
      <div class="res-linha">${pillCanal(c.canal)}
        <span class="res-per">${I.cal} ${c.ini} a ${c.fim}</span>
        <span class="res-selo ${seloCls}">${seloRot}</span></div>
      <h1 class="res-tit">${esc(s.titulo)}</h1>
      <p class="res-sub">${nf.format(s.clientes)} clientes no público · campanha criada em ${c.criadaEm}</p>
      ${parcial}
    </div>
  </div>`;

  // Veredito com a mesma casca dos outros blocos da página: mesmo fundo, mesma
  // borda, mesmo raio. O destaque vem do tamanho do texto, não de um traço azul
  // que só ele tinha e que o fazia parecer um alerta.
  const frase = `<div class="bloco res-veredito">${veredito(s, c, ant)}</div>`;

  // Campanha sem resultado ainda: não existe herói para mostrar, e mostrar
  // R$ 0,00 seria mentir. A tela para aqui, com o que fazer em seguida.
  if(fase==='futura' || !c.compras){
    return shell(`${cabecalho}${frase}
      <div class="bloco bloco-vazio res-espera">
        <h4 class="bloco-tit">O que aparece aqui depois</h4>
        <p class="bloco-nota">Faturamento gerado, quantos clientes compraram, ticket médio, o funil
        do público até a compra e a comparação com as campanhas anteriores deste mesmo público.</p>
      </div>
      ${blocoInvestimento(c)}`);
  }

  const herois = `<div class="herois">
    ${heroi('Faturamento gerado', brl(c.faturamento),
        `em ${nf.format(c.compras)} compras`,
        selo(delta(c.faturamento, ant && ant.faturamento), 'campanha anterior'))}
    ${heroi('Clientes que compraram', nf.format(c.clientesComp),
        `${Math.round(conv)} de cada 100 que receberam`,
        selo(delta(conv, convAnt), 'campanha anterior'))}
    ${heroi('Ticket médio', brl(ticket),
        'valor médio de cada compra',
        selo(delta(ticket, ticketAnt), 'campanha anterior'))}
  </div>`;

  // Ordem: veredito → números → como esses números se formaram → contexto.
  // A ressalva sobre incrementalidade foi para o fim: ela vale para a página
  // inteira, e no meio ela cortava a leitura entre um bloco de métrica e outro.
  return shell(`${cabecalho}${frase}${herois}
    ${funilCampanha(s, c)}
    ${blocoTicket(s, c)}
    ${barrasHistorico(s, c)}
    ${blocoInvestimento(c)}
    ${avisoIncremental()}`);
}

/* =========================================================================
   6. RENDER — wizard
   ========================================================================= */
const PERGUNTAS = [
  'Em quais lojas os clientes compram?',
  'Que perfil de comportamento você busca?',
  'Preferências de compra dos seus clientes',
  'Quem são esses clientes?',
  'Escolha os produtos que impactam o seu público'
];
const CABECALHOS = [
  ['Lojas onde compraram','Selecione uma ou mais lojas para considerar apenas os clientes que compraram nelas.'],
  ['Perfil comportamental','O comportamento recente ajuda a definir melhor o seu público.'],
  ['DNA','Identifique as necessidades e tipos de produtos que esses clientes costumam buscar.'],
  ['Informações demográficas','Aumente a precisão da segmentação com dados do perfil do cliente.'],
  ['Produtos','Escolha os produtos e quando essas compras aconteceram, ou siga para salvar o público.']
];

function telaWizard(){
  const stepper = STEPS.map((s,i)=>`<div class="step ${i<S.step?'done':''} ${i===S.step?'current':''}" ${i<S.step?'data-clickable="1" data-act="pular" data-v="'+i+'"':''}>
      <div class="bar"></div><div class="lbl">${s.label}</div></div>`).join('');

  const [ht,hs] = CABECALHOS[S.step];

  return shell(`
  <button class="backlink" data-act="${S.step===0?'sair':'voltar'}">${I.back} ${S.step===0?'Sair':'Voltar'}</button>
  <div class="wizhead">
    <div class="title"><h1>${PERGUNTAS[S.step]} ${tip('estimativa')}</h1></div>
    <div class="stepper">${stepper}</div>
  </div>
  <div class="wizbody">
    <div class="panel">
      <div class="panel-head"><div class="panel-icon">${I.box}</div><div><h2>${ht}</h2><p>${hs}</p></div></div>
      <div class="panel-body">${corpo}</div>

    ${aside()}
