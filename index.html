}

/* ---------- Aside ---------- */
function aside(){
  const e = S.estimativa;
  const load = S.calculando;
  const sk = v => load ? `<span class="skel">${v}</span>` : v;

  let bloco;
  if(!load && e && e.vazio==='sem-resultado'){
    // quando nenhum critério isolado é o responsável, é a soma deles que fecha o público
    const lista = (e.criterios||[]).map(c=>`<b>${c}</b>`);
    const listaTxt = lista.length>1
      ? lista.slice(0,-1).join(', ')+' e '+lista[lista.length-1]
      : lista[0]||'';
    const dica = e.extra ? e.extra
      : e.culpado ? `O critério <b>${e.culpado}</b> parece ser o mais restritivo. Sem ele, o público volta a ter cerca de ${nf.format(e.recupera)} clientes.`
      : lista.length>1 ? `Não é um critério só: a combinação de ${listaTxt} não encontra ninguém. Tire um deles para ver o público voltar.`
      : 'Tente afrouxar esse critério para encontrar clientes.';
    bloco = `<div class="bignum" style="background:var(--danger-soft)">
      <div class="v" style="color:var(--danger)">0</div>
      <div class="c" style="color:#8B2E2E">Nenhum cliente atende a todos os critérios</div></div>
      <div style="font-size:12.5px;color:var(--ink-3);line-height:1.55;padding:2px 2px 12px">${dica}</div>`;
  } else {
    const pct = e ? (e.pct>=0.995 ? '100' : nf1.format(e.pct*100)) : '—';
    bloco = `<div class="bignum">
      <div class="v">${sk(e?nf.format(e.clientes):'—')}</div>
      <div class="c">Clientes &nbsp;${sk(pct+'% da base')}</div></div>
      ${metric(I.money,'Faturamento total','faturamento', e?brl(e.faturamento):'—', load)}
      ${metric(I.money,'Ticket médio','ticket', e?brl(e.ticket):'—', load)}
      ${metric(I.box,'Produtos selecionados','prodsel', String(S.produtos.length), load)}
      ${S.compraPeriodos.length ? metric(I.cal,'Período de compra','periodoCompra', resumoPeriodos(), load) : ''}`;
  }

  const funil = (MOSTRAR_FUNIL && !load && e) ? funilBloco(e) : '';

  const temMed = PRODUTOS.filter(p=>S.produtos.includes(p.id)).some(p=>p.medicamento) || (S.step===STEP_PRODUTOS);
  const avisoMed = temMed ? `<div class="warnbox">${I.alert}<div><b>Atenção ao uso</b>Dados de medicamentos não podem ser usados para promoção ou publicidade.</div></div>` : '';

  const ultimo = S.step === STEPS.length-1;

  const n = S.pendentes;
  const flag = S.stale ? `<div class="stale-flag">
      <b>Estimativa desatualizada</b>
      ${n===1?'Você mudou 1 critério':'Você mudou '+n+' critérios'} depois do último cálculo. Clique em <b>Atualizar estimativa</b> para ver o público novo.
    </div>` : '';

  const travado = ultimo && S.stale;

  return `<div class="aside ${S.stale?'stale':''}">
    <h3>Total de clientes ${tip('estimativa')}</h3>
    ${flag}
    ${bloco}${funil}${avisoMed}
    <div class="aside-actions">
      <button class="btn ${S.stale?'btn-primary':'btn-soft'}" data-act="atualizar" ${(!S.stale||load)?'disabled':''}>
        ${load?'<span class="spin"></span>':I.refresh} ${load?'Calculando...':'Atualizar estimativa'}</button>
      ${S.step===0
        ? `<button class="btn btn-primary" data-act="avancar">Avançar ${I.fwd}</button>`
        : `<div class="nav-pair">
             <button class="btn btn-soft" data-act="voltar">${I.back} Voltar</button>
             <button class="btn btn-primary" data-act="${ultimo?'abrirModal':'avancar'}" ${travado?'disabled':''}>${ultimo?'Salvar público':'Avançar'} ${ultimo?'':I.fwd}</button>
           </div>`}
      ${travado?`<p style="margin:0;font-size:12px;color:var(--ink-4);line-height:1.45;text-align:center">Atualize a estimativa antes de salvar.</p>`:''}
      <p class="janela-nota">Análise feita sobre os últimos ${JANELA_MESES} meses de compras.</p>
    </div></div>`;
}
/* ---------- Funil: como cada etapa reduz o público ---------- */
function funilBloco(e){
  if(!e || !e.funil || e.funil.length < 2) return '';
  const topo = e.funil[0].clientes || 1;
  let jaZerou = false;
  const linhas = e.funil.map(f=>{
    const larg = Math.max(3, Math.round((f.clientes/topo)*100));
    const zerouAqui = f.clientes === 0 && !jaZerou;
    if(f.clientes === 0) jaZerou = true;
    const corte = f.primeiro ? '<span class="fn-base">ponto de partida</span>'
      : zerouAqui ? '<span class="fn-corte bad">o público zerou nesta etapa</span>'
      : f.clientes === 0 ? '<span class="fn-corte none">já não havia clientes aqui</span>'
      : f.corte < 0.005 ? '<span class="fn-corte none">não reduziu</span>'
      : `<span class="fn-corte">−${nf1.format(f.corte*100)}% em relação à etapa anterior</span>`;
    const zero = zerouAqui;
    return `<div class="fn-item">
      <div class="fn-top"><span class="fn-nome">${f.etapa}</span><span class="fn-num">${nf.format(f.clientes)}</span></div>
      <div class="fn-bar"><i style="width:${larg}%" class="${zero?'bad':''}"></i></div>
      <div class="fn-sub">${corte}</div>
    </div>`;
  }).join('');
  const aberto = S.funilAberto;
  return `<div class="funil ${aberto?'on':''}">
    <button class="fn-head" data-act="toggleFunil">
      ${I.funnel} <span>Como chegamos nesse número</span> <i class="fn-caret">${I.chev}</i>
    </button>
    ${aberto ? `<div class="fn-body">
      <p class="fn-hint">Cada etapa filtra os clientes que sobraram da etapa anterior.</p>
      ${linhas}
    </div>` : ''}
  </div>`;
}

function metric(ic,nome,tk,val,load){
  return `<div class="metric"><div class="k">${ic} ${nome} ${tip(tk)}</div>
    <div class="v ${load?'skel':''}">${val}</div></div>`;
}

/* ---------- Helpers de data (usados pelos períodos de compra) ---------- */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseYmd = s => s ? new Date(s+'T12:00:00') : null;
const fmtBr = s => s ? parseYmd(s).toLocaleDateString('pt-BR') : '';
const addDias = (d,n) => new Date(d.getTime()+n*DIA);

/* ---------- Etapa 2: lojas ---------- */
/* Filtra as lojas. `ignorar` deixa um campo de fora — é assim que cada dropdown
   descobre quais opções ainda levam a algum resultado, sem se filtrar a si mesmo. */
function filtrarLojas(ignorar){
  const b = S.lojaBusca.trim().toLowerCase();
  return LOJAS.filter(l=>{
    if(ignorar!=='busca' && b && !(l.nome.toLowerCase().includes(b)||l.cnpj.includes(b)||l.cidade.toLowerCase().includes(b))) return false;
    if(ignorar!=='lojaBandeira' && S.lojaBandeira && l.bandeira!==S.lojaBandeira) return false;
    if(ignorar!=='lojaUf'       && S.lojaUf       && l.uf!==S.lojaUf) return false;
    if(ignorar!=='lojaCidade'   && S.lojaCidade   && l.cidade!==S.lojaCidade) return false;
    return true;
  });
}
const ordAZ = (a,b)=>a.localeCompare(b,'pt-BR');

function painelLojas(){
  const list = filtrarLojas();
  const PP=8, pgs=Math.max(1,Math.ceil(list.length/PP));
  if(S.lojaPag>pgs) S.lojaPag=pgs;
  if(S.lojaPag<1) S.lojaPag=1;
  const page = list.slice((S.lojaPag-1)*PP, S.lojaPag*PP);
  const todosNaPag = page.length && page.every(l=>S.lojas.includes(l.id));

  const tudo = S.lojas.length===LOJAS.length;

  // cada dropdown mostra só o que ainda tem loja correspondente
  const bandeiras = [...new Set(filtrarLojas('lojaBandeira').map(l=>l.bandeira))].sort(ordAZ);
  const ufs       = [...new Set(filtrarLojas('lojaUf').map(l=>l.uf))].sort(ordAZ);
  const cidades   = [...new Set(filtrarLojas('lojaCidade').map(l=>l.cidade))].sort(ordAZ);
  const temFiltro = S.lojaBusca || S.lojaBandeira || S.lojaUf || S.lojaCidade;

  // contagem + ações em massa ficam na linha do rodapé da tabela, sem caixa extra
  const rodape = `<span class="selinfo">${S.lojas.length} de ${LOJAS.length} selecionadas</span>
    <button class="linkbtn" data-act="lojasTodas" ${tudo?'disabled':''}>Marcar todas</button>
    <button class="linkbtn" data-act="lojasNenhuma" ${S.lojas.length?'':'disabled'}>Desmarcar todas</button>`;

  return `<div class="filters">
    <div class="search">${I.search}<input data-k="lb" data-act="lojaBusca" placeholder="Busque pelo nome, CNPJ, cidade..." value="${esc(S.lojaBusca)}"></div>
    ${sel('Bandeira','lojaBandeira',bandeiras,S.lojaBandeira)}
    ${sel('Estado','lojaUf',ufs,S.lojaUf)}
    ${sel('Cidade','lojaCidade',cidades,S.lojaCidade)}
    ${temFiltro?`<div class="field"><label>&nbsp;</label><button class="btn btn-ghost btnfiltro" data-act="limparFiltrosLoja">Limpar filtros</button></div>`:''}
  </div>
  ${!list.length ? vazioTabela('Nenhuma loja encontrada','Ajuste a busca ou clique em “Limpar filtros” para ver as lojas novamente.') : `
  <div class="tablewrap"><table>
    <thead><tr><th style="width:44px"><span class="cb ${todosNaPag?'on':''}" data-act="lojasPag">${todosNaPag?I.check:''}</span></th>
      <th>CNPJ</th><th>Bandeira</th><th>Nome da loja</th><th>Cidade</th><th>Estado</th></tr></thead>
    <tbody>${page.map(l=>{const on=S.lojas.includes(l.id);
      return `<tr class="${on?'sel':''}" data-act="toggleLoja" data-v="${l.id}">
        <td><span class="cb ${on?'on':''}">${on?I.check:''}</span></td>
        <td>${l.cnpj}</td><td>${l.bandeira}</td><td>${esc(l.nome)}</td><td>${l.cidade}</td><td>${l.uf}</td></tr>`}).join('')}
    </tbody></table></div>
  ${pager(list.length,S.lojaPag,pgs,'lojaPag',rodape)}
  ${S.lojas.length?'':`<p class="avisozero">${I.alert} Sem nenhuma loja marcada o público fica zerado. Marque pelo menos uma.</p>`}`}`;
}

/* ---------- Etapa 3: produtos ---------- */
/* Períodos fechados de compra — só semanas e meses já encerrados,
   para o usuário nunca comparar um período pela metade com um período inteiro. */
/* Grade de meses de um ano — 4 colunas, meses fechados clicáveis. */
function gradeMeses(){
  const ano = S.perAno;
  const cells = Array.from({length:12},(_,m)=>{
    const p = mesDe(ano,m);
    const livre = periodoFechado(p);
    const on = S.compraPeriodos.includes(p.chave);
    const razao = !livre ? (p.ini >= HOJE_MS || p.fim >= HOJE_MS ? 'Mês ainda não fechou' : 'Fora dos últimos '+JANELA_MESES+' meses') : '';
    return `<button class="dp-m ${on?'on':''}" ${livre?'':'disabled'} title="${razao}"
      data-act="togglePeriodo" data-v="${p.chave}">${MESES[m].slice(0,3)}</button>`;
  }).join('');
  return `<div class="dp-nav">
      <button data-act="perAno" data-v="${ano-1}" ${ano-1<ANO_MIN?'disabled':''} aria-label="Ano anterior">${I.left}</button>
      <b>${ano}</b>
      <button data-act="perAno" data-v="${ano+1}" ${ano+1>ANO_MAX?'disabled':''} aria-label="Próximo ano">${I.right}</button>
    </div>
    <div class="dp-meses">${cells}</div>`;
}

/* Calendário do mês com as SEMANAS como linhas clicáveis —
   mesma moldura da grade de meses, para o usuário não reaprender o componente. */
function gradeSemanas(){
  const ref = new Date(S.perMes);
  const ultimo = new Date(ref.getFullYear(), ref.getMonth()+1, 0);
  const primeiraSeg = segundaDe(new Date(ref.getFullYear(), ref.getMonth(), 1));
  const antes = new Date(ref.getFullYear(), ref.getMonth()-1, 1);
  const depois = new Date(ref.getFullYear(), ref.getMonth()+1, 1);
  const podeAntes = antes.getTime() >= new Date(new Date(JANELA_INI).getFullYear(), new Date(JANELA_INI).getMonth(), 1).getTime();
  const podeDepois = depois.getTime() <= new Date(HOJE.getFullYear(), HOJE.getMonth(), 1).getTime();

  let linhas = '';
  for(let i=0;i<6;i++){
    const wIni = new Date(primeiraSeg.getTime() + i*7*DIA);
    if(wIni > ultimo) break;
    const p = semanaDe(wIni);
    const livre = periodoFechado(p);
    const on = S.compraPeriodos.includes(p.chave);
    const dias = Array.from({length:7},(_,k)=>{
      const d = new Date(wIni.getTime()+k*DIA);
      const fora = d.getMonth()!==ref.getMonth();
      const hoje = d.getTime()===HOJE_MS;
      return `<i class="${fora?'fora':''} ${hoje?'hoje':''}">${d.getDate()}</i>`;
    }).join('');
    linhas += `<button class="dp-wk ${on?'on':''}" ${livre?'':'disabled'}
      title="${livre?'Semana de '+p.rotulo:'Semana ainda não fechou ou está fora do histórico'}"
      data-act="togglePeriodo" data-v="${p.chave}">
      <span class="dp-wk-dias">${dias}</span>
      <span class="dp-wk-tag">${on?I.check:''}</span></button>`;
  }
  return `<div class="dp-nav">
      <button data-act="perMes" data-v="${antes.getTime()}" ${podeAntes?'':'disabled'} aria-label="Mês anterior">${I.left}</button>
      <b>${MESES[ref.getMonth()].charAt(0).toUpperCase()+MESES[ref.getMonth()].slice(1)} ${ref.getFullYear()}</b>
      <button data-act="perMes" data-v="${depois.getTime()}" ${podeDepois?'':'disabled'} aria-label="Próximo mês">${I.right}</button>
    </div>
    <div class="dp-dow"><i>S</i><i>T</i><i>Q</i><i>Q</i><i>S</i><i>S</i><i>D</i></div>
    <div class="dp-wks">${linhas}</div>
    <p class="dp-nota">Clique na linha para escolher a semana inteira (segunda a domingo).</p>`;
}

function popPeriodos(){
  const semana = S.compraTipo==='semana';
  return `<div class="dppop" data-stop="1">
    <div class="dp-head">
      <div class="seg segsm">
        <button class="${semana?'':'on'}" data-act="compraTipo" data-v="mes">Por mês</button>
        <button class="${semana?'on':''}" data-act="compraTipo" data-v="semana">Por semana</button>
      </div>
    </div>
    <div class="dp-body">${semana ? gradeSemanas() : gradeMeses()}</div>
    <div class="dp-foot">
      <button class="linkbtn" data-act="limparPeriodos" ${S.compraPeriodos.length?'':'disabled'}>Limpar</button>
      <button class="btn btn-primary btnsm" data-act="fecharPeriodos">Pronto</button>

}

      </div>

          ${I.cal}<span>${rotulo}</span>${I.chev}</button>

      </div>

  </div>`;
}

function painelProdutos(){
  const b = S.prodBusca.trim().toLowerCase();
  let list = PRODUTOS.filter(p=>{
    if(b && !(p.nome.toLowerCase().includes(b)||p.ean.includes(b))) return false;

  const subs = S.prodCat ? CATS[S.prodCat] : [];

  const tags = S.produtos.length
    ? PRODUTOS.filter(p=>S.produtos.includes(p.id)).slice(0,14).map(p=>`<span class="tag">${esc(p.nome)} <button data-act="toggleProd" data-v="${p.id}">×</button></span>`).join('') + (S.produtos.length>14?`<span class="tag" style="background:#EDF1F6;color:var(--ink-3)">+${S.produtos.length-14}</span>`:'')
    : `<div class="muted">Selecione abaixo os produtos que deseja incluir na sua segmentação de público.</div>`;

  return `${blocoPeriodoCompra()}
  <div class="selbox"><div class="t">Produtos selecionados: ${S.produtos.length}</div>${tags}</div>
  <div class="filters">
    <div class="search">${I.search}<input data-k="pb" data-act="prodBusca" placeholder="Digite o nome, EAN ou SKU" value="${esc(S.prodBusca)}"></div>
    ${sel('Categorias','prodCat',Object.keys(CATS),S.prodCat)}
    ${sel('Sub-categorias','prodSub',subs,S.prodSub,!S.prodCat)}
    ${sel('Indústria','prodInd',INDUSTRIAS,S.prodInd)}
  </div>
  ${!list.length ? vazioTabela('Nenhum produto encontrado','Verifique o nome ou o EAN digitado, ou limpe os filtros.') : `
  <div class="tablewrap"><table>
    <thead><tr><th style="width:44px"><span class="cb ${todosNaPag?'on':''}" data-act="prodsPag">${todosNaPag?I.check:''}</span></th>
      <th>Produto</th><th>Categoria</th><th>Sub-categoria</th><th>EAN</th></tr></thead>
    <tbody>${page.map(p=>{const on=S.produtos.includes(p.id);
      return `<tr class="${on?'sel':''}" data-act="toggleProd" data-v="${p.id}">
        <td><span class="cb ${on?'on':''}">${on?I.check:''}</span></td>
        <td>${esc(p.nome)}</td><td>${p.tipo}</td><td>${p.sub}</td><td>${p.ean}</td></tr>`}).join('')}
    </tbody></table></div>
  ${pager(list.length,S.prodPag,pgs,'prodPag')}`}`;
}

/* ---------- Etapa 4: demográfico ---------- */
function painelDemografico(){

/* ---------- Etapa 6: DNA ---------- */
const GRAUS = ['Baixa','Média','Alta'];

/* Quem é o cliente de cada faixa, em uma frase.
   É a primeira coisa que o usuário lê — precisa dizer o comportamento,
   não o número por trás dele. */
const GRAU_QUEM = {
  'Baixa':'compram de vez em quando; a maior parte do consumo está em outro lugar.',
  'Média':'já compram com alguma regularidade, mas ainda dividem com outro canal.',
  'Alta':'procuram muito esse tipo de produto e compram com mais frequência que a média.'
};

const lista = itens => itens.map(x=>`<div class="li">${x}</div>`).join('');

/* As três faixas aparecem SEMPRE que o card está aberto, ligadas ou não.
   Quem não foi escolhida fica apagada, mas legível: o usuário compara os três
   comportamentos antes de decidir, em vez de escolher no escuro. */
function secaoGrau(d, grau, dnaLigado){
  const graus = S.dna[d.id] || [];
  const on = graus.includes(grau);
  const ins = insightDna(d.id, grau);
  const chave = d.id+'|'+grau;

  // sem o DNA ligado o switch existe mas não responde — mostra o que virá,
  // sem deixar ligar uma faixa de um DNA que está fora do público
  const sw = `<span class="switch ${on?'on':''} ${dnaLigado?'':'travado'}"
    role="switch" aria-checked="${on}" ${dnaLigado?'':'aria-disabled="true"'}
    ${dnaLigado?`data-act="toggleGrau" data-v="${chave}"`:''}></span>`;

  return `<section class="${on?'gsec on':'gsec'}" ${dnaLigado?`data-act="toggleGrau" data-v="${chave}"`:''}>
    <div class="gsec-head">${sw}<h5 class="gsec-tit">${grau} aderência</h5></div>
    <p class="gsec-desc">${ins.perfil || GRAU_QUEM[grau]}</p>
    <div class="dna-par">
      <div class="dna-par-col">
        <b class="dna-par-tit">O que costuma acontecer</b>
        ${lista(ins.comport)}
      </div>
      <div class="dna-par-col">
        <b class="dna-par-tit">Sugestões de ação</b>
        ${lista(ins.oport)}
      </div>
    </div>
  </section>`;
}

/* Alta primeiro: é o grupo que o usuário quase sempre procura, e a leitura
   de cima para baixo vai do mais engajado para o menos. */
const GRAUS_UI = ['Alta','Média','Baixa'];

function insightsGrau(d, graus){
  const ligado = !!S.dna[d.id];
  const n = (graus||[]).length;
  const rodape = !ligado
    ? `<p class="gsec-nota">${I.info} Ligue <b>${d.nome}</b> acima para poder escolher as faixas.</p>`
    : n===0
      ? `<p class="gsec-nota alerta">${I.alert} Nenhuma faixa ligada — do jeito que está, esse DNA não traz ninguém.</p>`
      : n===3
        ? `<p class="gsec-nota">${I.info} As três ligadas: esse DNA entra com o grupo inteiro.</p>`
        : '';
  return `<div class="gsecs">
    ${GRAUS_UI.map(g=>secaoGrau(d,g,ligado)).join('')}
    ${rodape}
    <button class="gfechar" data-act="fecharInsight">Fechar <i class="gf-caret">${I.chev}</i></button>
  </div>`;
}

function painelDna(){
  const cards = DNAS.map(d=>{
    const ligado = !!S.dna[d.id];
    const graus = S.dna[d.id] || [];
    const aberto = S.dnaExpandido===d.id;
    const resumo = ligado && graus.length && graus.length<3
      ? `<span class="gcount">${GRAUS_UI.filter(g=>graus.includes(g)).join(' · ')}</span>` : '';

    // o cabeçalho inteiro abre o card; o switch para o clique antes de chegar lá
    return `<div class="dna ${ligado?'on':''} ${aberto?'aberto':''}">
      <div class="dna-row" data-act="expandDna" data-v="${d.id}">
        <div class="dna-a">
          <span class="switch ${ligado?'on':''}" role="switch" aria-checked="${ligado}"
            data-act="toggleDna" data-v="${d.id}"></span>
          <div><h4>${d.nome} ${resumo}</h4><p>${d.desc}</p></div>
        </div>
        <div class="dna-b"><b>Como usar:</b>${d.uso}</div>
        ${aberto?'':`<div class="dna-c"><i class="dna-caret">${I.chev}</i></div>`}
      </div>
      ${aberto ? insightsGrau(d, graus) : ''}
    </div>`;
  }).join('');

  return `<div class="infobox">Cada DNA representa o comportamento de compra dos clientes, agrupando perfis com interesses e necessidades semelhantes a partir dos produtos que costumam comprar. Assim, é possível entender melhor o perfil de consumo e quais produtos podem ser mais relevantes para cada cliente.</div>
  <div>${cards}</div>
  ${(()=>{ const ligados = Object.keys(S.dna);
    if(!ligados.length) return `<p class="hint" style="margin-top:16px;color:var(--ink-4)">Nenhum DNA ligado — o público não está sendo filtrado por comportamento de consumo.</p>`;
    const resumo = ligados.map(k=>{ const n = (DNAS.find(x=>x.id===k)||{}).nome || k;
      const g = GRAUS_UI.filter(x=>S.dna[k].includes(x));
      return `<b>${n}</b> (${g.join(' + ')||'nenhuma faixa'})`; }).join(', ');
    return `<p class="hint" style="margin-top:16px;color:var(--ink-4)">Escolhido: ${resumo}.${
      ligados.length>1 ? ` O público inclui quem se encaixa em ${OPTS.dnaLogic==='AND'?'<b>todos</b> eles':'<b>qualquer um</b> deles'}.` : ''}</p>`;
  })()}`;
}

function pager(total,pg,pgs,campo,extra){
  const esq = pgs<=1

}

/* Campos obrigatórios. Devolve a chave do problema de cada campo, para o erro
   nascer colado no campo — mensagem só no topo obriga a pessoa a procurar. */
function faltamNoModal(){
  const f = {};
  if(!S.modalTitulo.trim()) f.nome = 'Dê um nome para encontrar essa segmentação depois.';
  if(!S.modalObjetivo.trim()) f.objetivo = 'Escreva o que você quer alcançar com esse público.';
  if(!S.modalAte) f.ate = 'Escolha até quando a segmentação ficará disponível.';
  else if(parseYmd(S.modalAte) <= HOJE) f.ate = 'Escolha uma data a partir de amanhã.';
  return f;
}
const contaFaltas = () => Object.keys(faltamNoModal()).length;

function resumoModal(){
  const e = S.estimativa;
  const nada = '—';
  const rfv = S.rfv.length ? S.rfv.map(id=>(RFVS.find(r=>r.id===id)||{}).nome||id).join(', ') : 'Todos os perfis';
  const dnas = Object.keys(S.dna);
  const dnaTxt = dnas.length
    ? dnas.map(k=>(DNAS.find(x=>x.id===k)||{}).nome||k).join(', ')
    : 'Nenhum';
  const demo = [
    S.genero.length ? S.genero.map(g=>(GENEROS.find(x=>x[0]===g)||[])[1]||g).join(', ') : '',
    S.faixa.length ? S.faixa.join(', ')+' anos' : ''
  ].filter(Boolean).join(' · ') || 'Todos';

  // Todas as linhas com o mesmo peso — o resumo é conferência, não leitura em
  // destaque. Em duas colunas o bloco encurta e cabe numa varredura só.
  const item = (rot,val) => `<div class="rm-item">
    <span class="rm-k">${rot}</span><span class="rm-v">${val}</span></div>`;

  return `<section class="rm" aria-label="Resumo da segmentação">

    <div class="rm-grid">
      ${item('Clientes', e&&!e.vazio?nf.format(e.clientes):nada)}
      ${item('Lojas', `${S.lojas.length} de ${LOJAS.length}`)}
      ${item('Faturamento total', e&&!e.vazio?brl(e.faturamento):nada)}
      ${item('Ticket médio', e&&!e.vazio?brl(e.ticket):nada)}
      ${item('Perfil', rfv)}
      ${item('DNA', dnaTxt)}
      ${item('Dados demográficos', demo)}
      ${item('Período de compra', S.compraPeriodos.length?resumoPeriodos():`Últimos ${JANELA_MESES} meses`)}

  </section>`;
}

/* ---------- Modal: nova campanha a partir de uma segmentação ---------- */
function faltamNaCampanha(){
  const s = S.segmentacoes.find(x=>x.id===S.modalCamp);
  const limite = s && s.disponivelAte ? brDate(s.disponivelAte) : null;
  const f = {};
  if(!S.campIni) f.ini = 'Escolha quando a campanha começa.';
  else if(parseYmd(S.campIni) < HOJE) f.ini = 'A campanha não pode começar antes de hoje.';
  else if(limite && parseYmd(S.campIni) > limite) f.ini = `A segmentação fica disponível só até ${s.disponivelAte}.`;
  if(!S.campFim) f.fim = 'Escolha quando a campanha termina.';
  else if(S.campIni && parseYmd(S.campFim) < parseYmd(S.campIni)) f.fim = 'O término não pode ser antes do início.';
  else if(limite && parseYmd(S.campFim) > limite) f.fim = `A campanha precisa terminar até ${s.disponivelAte}, quando a segmentação vence.`;
  if(!S.campCanal) f.canal = 'Escolha por onde falar com esses clientes.';
  return f;
}

/* "faltam 45 dias" comunica melhor que uma data solta para quem tem pouca
   familiaridade com o produto. */
function diasAte(s){
  const d = Math.round((parseYmd(s) - HOJE)/DIA);
  if(d <= 1) return 'amanhã';
  if(d < 31) return `daqui a ${d} dias`;
  const m = Math.round(d/30);
  return m===1 ? 'daqui a cerca de 1 mês' : `daqui a cerca de ${m} meses`;
}

/* =========================================================================
   7. RENDER PRINCIPAL
   ========================================================================= */
function render(){
  const a = document.activeElement;
  const key = a && a.dataset ? a.dataset.k : null;
  let pos = null; try{ pos = a && a.selectionStart; }catch(e){}

  let html = S.screen==='list' ? telaLista()
           : S.screen==='resultados' ? telaResultados()
           : telaWizard();
  if(S.modal) html += modalSalvar();
  if(S.modalCamp) html += modalNovaCampanha();
  if(S.toast) html += `<div class="toast">${esc(S.toast)}</div>`;
  root.innerHTML = html;

  if(key){ const n = root.querySelector('[data-k="'+key+'"]'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
}

/* =========================================================================
   8. AÇÕES
   ========================================================================= */
function toast(msg){ S.toast = msg; render(); setTimeout(()=>{ S.toast=''; render(); },2600); }
const arrToggle = (arr,v)=> arr.includes(v) ? arr.filter(x=>x!==v) : arr.concat([v]);

root.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  // BUG antigo: abrir um <select> disparava 'filtro' + render(), o que refazia o DOM
  // e fechava a lista na cara do usuário. Select só responde ao evento 'change'.
  if(el.tagName==='SELECT' || ev.target.tagName==='SELECT') return;
  if(el.tagName==='INPUT' || ev.target.tagName==='INPUT') return;
  const act = el.dataset.act, v = el.dataset.v;
  if(act==='fecharModalBg' && ev.target.closest('[data-stop]')) return;
  handle(act, v, el);
});
root.addEventListener('input', ev=>{
  const el = ev.target.closest('[data-act]');
  if(!el || el.tagName==='SELECT') return;
  handle(el.dataset.act, el.value, el, true);
});
root.addEventListener('change', ev=>{
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  if(el.tagName==='SELECT') handle('filtro', el.dataset.v, el);
});
// clique fora fecha o seletor de períodos e o menu "..." dos cards
document.addEventListener('mousedown', ev=>{
  const dentro = sel => ev.target.closest && ev.target.closest(sel);
  let mudou = false;
  if(S.perAberto && !dentro('.dpwrap')){ S.perAberto=false; log('periodos-fechou','clique fora'); mudou=true; }
  if(S.menuSeg && !dentro('.maiswrap')){ S.menuSeg=null; log('menu-segmentacao','clique fora'); mudou=true; }
  if(mudou) render();
});
document.addEventListener('keydown', ev=>{
  if(ev.key!=='Escape') return;
  let mudou = false;
  if(S.perAberto){ S.perAberto=false; log('periodos-fechou','esc'); mudou=true; }
  if(S.menuSeg){ S.menuSeg=null; log('menu-segmentacao','esc'); mudou=true; }
  if(mudou) render();
});

function handle(act, v, el, isInput){
  switch(act){
    case 'tabNoop': toast('Só a aba Segmentação está disponível neste protótipo.'); log('aba-indisponivel', v); return;

    case 'nova':
      S = Object.assign(estadoInicial(), {segmentacoes:S.segmentacoes, screen:'wizard', step:0});
      // já entra com a estimativa da base inteira: todas as lojas vêm marcadas,
      // então o número da direita tem que bater com isso desde o primeiro segundo
      S.estimativa = calcular(); S.stale = false; S.pendentes = 0;
      log('inicio-fluxo', nf.format(S.estimativa.clientes)+' clientes na base');
      tStep = Date.now(); render(); return;

    case 'sair':
      log('saiu-fluxo'); S.screen='list'; S.modal=false; render(); return;

    case 'voltar':
      if(S.step>0){ log('voltou', STEPS[S.step].label+' → '+STEPS[S.step-1].label); S.step--; tStep=Date.now(); render(); }
      return;

    case 'avancar':
      log('avancou', STEPS[S.step].label+' ('+Math.round((Date.now()-tStep)/1000)+'s'+(S.stale?', estimativa desatualizada':'')+')');
      S.step = Math.min(STEPS.length-1, S.step+1); tStep=Date.now();
      render();
      return;

    case 'pular':
      log('pulou-para', STEPS[+v].label); S.step=+v; tStep=Date.now(); render(); return;

    /* ---- períodos fechados de compra (etapa Produtos) ---- */
    case 'abrirPeriodos':
      S.perAberto = !S.perAberto;
      if(S.perAberto){
        // abre onde o usuário parou; sem escolha, no período fechado mais recente —
        // que para MÊS é o mês passado e para SEMANA está dentro do mês corrente.
        const p = periodosEscolhidos();
        const ref = p.length ? new Date(p[p.length-1].ini)
                  : S.compraTipo==='semana' ? new Date(HOJE.getFullYear(), HOJE.getMonth(), 1)
                  : new Date(HOJE.getFullYear(), HOJE.getMonth()-1, 1);
        S.perAno = Math.min(ANO_MAX, Math.max(ANO_MIN, ref.getFullYear()));
        S.perMes = new Date(ref.getFullYear(), ref.getMonth(), 1).getTime();
      }
      log('periodos', S.perAberto?'abriu':'fechou'); render(); return;

    case 'fecharPeriodos': S.perAberto=false; log('periodos','pronto'); render(); return;

    case 'perAno':  S.perAno = +v; log('periodos-ano', v); render(); return;
    case 'perMes':  S.perMes = +v; log('periodos-mes', fmtD(+v)); render(); return;

    case 'compraTipo':
      if(S.compraTipo===v) return;
      S.compraTipo = v;
      // reposiciona o calendário no período fechado mais recente da nova escala
      S.perAno = HOJE.getFullYear();
      S.perMes = new Date(HOJE.getFullYear(), HOJE.getMonth() - (v==='semana'?0:1), 1).getTime();
      // trocar de semana para mês zera a escolha: misturar as duas escalas confunde
      if(S.compraPeriodos.length){ S.compraPeriodos = []; log('periodo-compra-limpou','troca de escala'); marcarSujo('período de compra'); }
      else render();
      log('periodo-compra-tipo', v);
      return;

    case 'togglePeriodo': {
      // um período de semana e um de mês na mesma seleção viram um público
      // que o usuário não consegue explicar — a escala manda.
      const tipo = v[0]==='w' ? 'semana' : 'mes';
      if(tipo!==S.compraTipo){ S.compraTipo = tipo; S.compraPeriodos = []; }
      S.compraPeriodos = arrToggle(S.compraPeriodos, v);
      log('periodo-compra', v+' ('+S.compraPeriodos.length+' selecionado(s))');
      marcarSujo('período de compra'); return; }

    case 'limparPeriodos':
      if(!S.compraPeriodos.length) return;
      S.compraPeriodos = []; log('periodo-compra-limpou','clique');
      marcarSujo('período de compra'); return;

    case 'toggleLoja': S.lojas = arrToggle(S.lojas,v); log('loja', v); marcarSujo('lojas'); return;
    case 'lojasPag': {
      const vis = visiveisLojas(); const todos = vis.every(l=>S.lojas.includes(l.id));
      S.lojas = todos ? S.lojas.filter(x=>!vis.some(l=>l.id===x)) : [...new Set(S.lojas.concat(vis.map(l=>l.id)))];
      log('lojas-pagina', todos?'desmarcou':'marcou'); marcarSujo('lojas'); return; }
    case 'lojaBusca': S.lojaBusca=v; S.lojaPag=1; render(); return;
    case 'lojasTodas':
      if(S.lojas.length===LOJAS.length) return;
      S.lojas = LOJAS.map(l=>l.id); log('lojas-todas'); marcarSujo('lojas'); return;
    case 'lojasNenhuma':
      if(!S.lojas.length) return;
      S.lojas = []; log('lojas-nenhuma'); marcarSujo('lojas'); return;
    case 'limparFiltrosLoja':
      S.lojaBusca=''; S.lojaBandeira=''; S.lojaUf=''; S.lojaCidade=''; S.lojaPag=1;
      log('lojas-limpou-filtros'); render(); return;

    case 'toggleProd': S.produtos = arrToggle(S.produtos,v); log('produto', v); marcarSujo('produtos'); return;
    case 'prodsPag': {
      const vis = visiveisProdutos(); const todos = vis.every(p=>S.produtos.includes(p.id));
      S.produtos = todos ? S.produtos.filter(x=>!vis.some(p=>p.id===x)) : [...new Set(S.produtos.concat(vis.map(p=>p.id)))];
      log('produtos-pagina', todos?'desmarcou':'marcou'); marcarSujo('produtos'); return; }
    case 'prodBusca': S.prodBusca=v; S.prodPag=1; render(); return;

    case 'filtro': {
      const campo = v, val = el.value;
      if(S[campo]===val) return;              // não redesenha à toa
      S[campo] = val;
      if(campo==='prodCat'){ S.prodSub=''; S.prodPag=1; }
      if(campo==='prodInd'||campo==='prodSub') S.prodPag=1;
      if(campo.startsWith('loja')){
        S.lojaPag=1;
        // Estado manda na Cidade: trocar de estado com uma cidade de outro estado
        // marcada dava lista vazia sem explicação nenhuma.
        if(campo==='lojaUf' && S.lojaCidade && !LOJAS.some(l=>l.uf===val && l.cidade===S.lojaCidade)) S.lojaCidade='';
        if(campo==='lojaCidade' && val){
          const l0 = LOJAS.find(l=>l.cidade===val);
          if(l0 && S.lojaUf && l0.uf!==S.lojaUf) S.lojaUf = l0.uf;
        }
      }
      log('filtro', campo+'='+(val||'todos')); render(); return; }

    case 'pag': { const [c,p]=v.split('|'); S[c]=+p; render(); return; }

    case 'toggleGen': S.genero=arrToggle(S.genero,v); log('genero',v); marcarSujo('gênero'); return;
    case 'toggleFx':  S.faixa=arrToggle(S.faixa,v);   log('faixa',v);  marcarSujo('faixa etária'); return;
    case 'toggleRfv': S.rfv=arrToggle(S.rfv,v);       log('rfv',v);    marcarSujo('perfil RFV'); return;

    /* Switch mestre. Ligar já abre as três faixas, com as três ativas:
       é o estado que o switch mostra de verdade, sem seleção escondida. */
    case 'toggleDna':
      if(S.dna[v]){ delete S.dna[v]; log('dna', v+' desligado'); }
      else { S.dna[v] = ['Alta']; S.dnaExpandido = v; log('dna', v+' ligado (Alta)'); }
      marcarSujo('DNA'); return;

    /* Faixa individual. Só responde com o DNA ligado (o switch nem carrega
       a ação quando está travado). Pode ficar com 0, 1, 2 ou as 3 —
       zero faixas é um estado válido e avisado, não um DNA meio ligado. */
    case 'toggleGrau': {
      const [d,g] = v.split('|');
      if(!S.dna[d]) return;
      const novo = arrToggle(S.dna[d], g);
      S.dna[d] = GRAUS.filter(x=>novo.includes(x));   // ordem canônica no estado
      S.dnaExpandido = d;
      log('aderencia', d+' = '+(S.dna[d].join(' + ')||'nenhuma'));
      marcarSujo('aderência'); return; }

    case 'fecharInsight': S.dnaExpandido=null; log('insight-fechou'); render(); return;

    case 'expandDna':
      S.dnaExpandido = S.dnaExpandido===v ? null : v;
      log('dna-detalhe', v); render(); return;

    case 'atualizar': recalcular('clique manual'); return;
    case 'toggleFunil': S.funilAberto = !S.funilAberto; log('funil', S.funilAberto?'abriu':'fechou'); render(); return;

    case 'abrirModal':
      S.modal=true; S.modalErro=''; S.modalSalvando=''; S.modalFase='';
      log('abriu-modal-salvar'); render(); return;
    case 'fecharModal': case 'fecharModalBg':
      if(S.modalSalvando) return;              // não fecha no meio do salvamento
      S.modal=false; log('fechou-modal'); render(); return;
    /* Ao digitar, some com o erro na hora: manter a mensagem vermelha depois
       que a pessoa já corrigiu é punir quem está consertando. Só redesenha
       quando o estado de trava muda, para não perder o cursor a cada tecla. */
    /* Enquanto o erro está na tela, cada tecla redesenha para o aviso do campo
       sumir assim que a pessoa corrige. Sem erro na tela, digitar não redesenha
       nada — não há botão travado para atualizar. */
    case 'modalTitulo': case 'modalObjetivo': {
      if(act==='modalTitulo') S.modalTitulo=v; else S.modalObjetivo=v;
      if(S.modalErro==='campos') render();
      return; }

    case 'modalAte':
      S.modalAte = v;
      render(); return;

    case 'salvar': case 'salvarExportar': salvar(act==='salvarExportar'); return;

    case 'busca': S.busca=v; render(); return;

    /* ---- campanhas da segmentação ---- */
    case 'abrirCampanhas':
      S.campAberta = S.campAberta===v ? null : v;
      S.menuSeg = null;
      log('campanhas', S.campAberta?'abriu '+v:'fechou'); render(); return;

    case 'verResultados': {
      const [sid,cid] = v.split('|');
      S.resSeg = sid; S.resCamp = cid; S.screen = 'resultados'; S.menuSeg = null;
      const sg = S.segmentacoes.find(x=>x.id===sid);
      const cp = sg && (sg.campanhas||[]).find(x=>x.id===cid);
      log('ver-resultados', (sg?sg.titulo:sid)+' · '+(cp?faseCampanha(cp):'?'));
      window.scrollTo(0,0); render(); return; }

    case 'voltarLista':
      // volta com o painel de campanhas daquela segmentação já aberto: sair da
      // tela e cair numa lista fechada faria a pessoa reabrir tudo de novo
      S.campAberta = S.resSeg; S.screen = 'list'; S.resSeg = null; S.resCamp = null;
      log('voltou-da-tela-de-resultados'); render(); return;

    case 'abrirModalCamp':
      S.modalCamp = v; S.campIni=''; S.campFim=''; S.campCanal=''; S.campInvest=''; S.campErro='';
      log('abriu-modal-campanha', v); render(); return;

    case 'fecharModalCamp': case 'fecharModalCampBg':
      S.modalCamp = null; log('fechou-modal-campanha'); render(); return;

    case 'campIni':
      S.campIni = v;
      // término antes do início deixa de fazer sentido: reancora
      if(S.campFim && parseYmd(S.campFim) < parseYmd(v)) S.campFim = '';
      render(); return;
    case 'campFim': S.campFim = v; render(); return;
    case 'campInvest': S.campInvest = v; return;
    case 'campCanal':
      S.campCanal = S.campCanal===v ? '' : v;
      if(S.campErro==='campos' && !Object.keys(faltamNaCampanha()).length) S.campErro='';
      render(); return;

    case 'criarCampanha': {
      const s = S.segmentacoes.find(x=>x.id===S.modalCamp); if(!s) return;
      if(Object.keys(faltamNaCampanha()).length){
        S.campErro='campos'; log('campanha-bloqueada', Object.keys(faltamNaCampanha()).join(', '));
        render(); return;
      }
      // campanha nova ainda não rendeu nada: faturamento e ticket ficam zerados
      // até o desempenho chegar, e é isso que o card mestre vai somar
      const nova = {
        id:'c'+Date.now(),
        ini: fmtBr(S.campIni), fim: fmtBr(S.campFim), criadaEm: fmtD(HOJE.getTime()),
        canal: S.campCanal, faturamento: 0, ticket: 0, compras: 0, clientesComp: 0,
        investimento: parseBrl(S.campInvest)
      };
      s.campanhas = [nova, ...(s.campanhas||[])];
      log('criou-campanha', s.titulo+' · '+CANAIS[S.campCanal][0]+' · '+nova.ini+' a '+nova.fim);
      S.modalCamp=null; S.campAberta=s.id;
      render();
      toast('Campanha criada para '+nf.format(s.clientes)+' clientes.');
      return; }

    case 'abrirMenuSeg':
      S.menuSeg = S.menuSeg===v ? null : v;
      log('menu-segmentacao', S.menuSeg?'abriu':'fechou'); render(); return;

    case 'acaoSeg': {
      // protótipo: as opções existem para o usuário reconhecer, mas não executam
      const [id,acao] = v.split('|');
      const s = S.segmentacoes.find(x=>x.id===id);
      const nomes = {excel:'Exportar em Excel', editar:'Editar', duplicar:'Duplicar', excluir:'Excluir'};
      S.menuSeg = null;
      log('acao-segmentacao', acao+' · '+(s?s.titulo:id));
      toast(`“${nomes[acao]}” ainda não funciona neste protótipo.`);
      return; }
  }
}

function visiveisLojas(){
  const b=S.lojaBusca.trim().toLowerCase();
  let l = LOJAS.filter(x=>(!b||x.nome.toLowerCase().includes(b)||x.cnpj.includes(b)||x.cidade.toLowerCase().includes(b))
    && (!S.lojaBandeira||x.bandeira===S.lojaBandeira) && (!S.lojaUf||x.uf===S.lojaUf) && (!S.lojaCidade||x.cidade===S.lojaCidade));
  return l.slice((S.lojaPag-1)*8, S.lojaPag*8);
}
function visiveisProdutos(){
  const b=S.prodBusca.trim().toLowerCase();
  let l = PRODUTOS.filter(p=>(!b||p.nome.toLowerCase().includes(b)||p.ean.includes(b))
    && (!S.prodCat||p.categoria===S.prodCat) && (!S.prodSub||p.sub===S.prodSub) && (!S.prodInd||p.industria===S.prodInd));
  return l.slice((S.prodPag-1)*10, S.prodPag*10);
}

function salvar(exportar){
  if(S.modalSalvando) return;                       // trava contra clique duplo
  if(S.stale){ S.modalErro='A estimativa está desatualizada. Atualize antes de salvar para não guardar um público diferente do que você viu.'; render(); return; }
  const faltam = faltamNoModal();
  if(Object.keys(faltam).length){
    // botão sempre clicável: quem aponta o que falta é o erro, não a trava
    S.modalErro='campos';
    log('salvar-bloqueado', Object.keys(faltam).join(', '));
    render();
    focarPrimeiroErro(faltam);
    return;
  }
  const e = S.estimativa && !S.estimativa.vazio ? S.estimativa : null;
  if(!e){ S.modalErro='Esse público está com 0 clientes. Ajuste os critérios antes de salvar.'; render(); return; }

  S.modalErro='';
  S.modalSalvando = exportar ? 'exportar' : 'salvar';
  S.modalFase = 'salvando';
  log('salvando', S.modalTitulo.trim() + (exportar?' + exportação':''));
  render();

  setTimeout(()=>{
    if(exportar){
      // duas etapas visíveis: salvar e depois gerar o arquivo
      S.modalFase = 'exportando';
      log('exportando', 'gerando Excel');
      render();
      setTimeout(()=>gravarSegmentacao(e, true), 900);
    } else {
      gravarSegmentacao(e, false);
    }
  }, 700);
}

/* Leva o cursor para o primeiro campo com problema: sem isso, em modal alto,
   a pessoa clica em salvar e não vê o que mudou na tela. */
function focarPrimeiroErro(faltam){
  const ordem = ['nome','objetivo','ate'];
  const id = {nome:'ms-nome', objetivo:'ms-obj', ate:'ms-ate'}[ordem.find(k=>faltam[k])];
  if(!id) return;
  const n = document.getElementById(id);
  if(n && n.focus) n.focus();
}

function gravarSegmentacao(e, exportar){
  const objetivo = S.modalObjetivo.trim();
  const seg = {
    id:'S'+Date.now(), titulo:S.modalTitulo.trim(),
    objetivo,
    periodo: S.compraPeriodos.length ? resumoPeriodos() : `Últimos ${JANELA_MESES} meses`,
    clientes:e.clientes, prods:S.produtos.length,
    disponivelAte: fmtBr(S.modalAte),
    rfv: S.rfv.length ? S.rfv.map(id=>(RFVS.find(r=>r.id===id)||{}).nome||id).join(', ') : 'Todos os perfis',
    dna: Object.keys(S.dna).length
      ? Object.keys(S.dna).map(k=>{ const n=(DNAS.find(x=>x.id===k)||{}).nome||k;
          const g=GRAUS_UI.filter(x=>S.dna[k].includes(x)); return n+(g.length?' ('+g.join(', ')+')':''); }).join(', ')
      : 'Nenhum',
    demo: [
      S.genero.length ? S.genero.map(g=>(GENEROS.find(x=>x[0]===g)||[])[1]||g).join(', ') : 'Todos',
      S.faixa.length ? S.faixa.join(', ')+' anos' : 'Todas as idades'
    ].join(' · '),
    campanhas: []
  };
  S.segmentacoes.unshift(seg);
  log('salvou', seg.titulo + ' · disponível até '+seg.disponivelAte + (exportar?' (com exportação)':''));
  S.modal=false; S.modalSalvando=''; S.modalFase=''; S.screen='list';
  render();
  toast(exportar
    ? 'Segmentação salva. O Excel foi enviado para download.'
    : 'Segmentação salva. Ela fica disponível até '+fmtBr(S.modalAte)+'.');
}

  ['4. Faixas de aderência','Ligue um DNA. O que você espera que aconteça se trocar de Média para Alta? Diga antes de clicar. Agora marque Média e Alta juntas — o público cresce ou diminui? Por quê?'],
  ['5. Insights do DNA','Você acabou de ver as sugestões de ação. Escolheria alguma delas para uma campanha? Por quê?'],
  ['6. Estimativa desatualizada','Marque dois perfis de RFV e, sem clicar em mais nada, me diga se o número da direita já considera essas escolhas.'],
  ['7. Período de compra','Você quer só quem comprou no mês passado. Onde faria isso? O que acha que muda no público?'],

];

const fac = document.getElementById('fac');
document.getElementById('fab').onclick = ()=> fac.classList.toggle('open');
document.getElementById('fac-close').onclick = ()=> fac.classList.remove('open');
document.getElementById('tasks').innerHTML = TAREFAS.map(([t,d])=>`<div class="task"><b>${t}</b>${d}</div>`).join('');

function pintarOpts(){
  document.querySelectorAll('#fac .switch2').forEach(sw=>{
    const k = sw.dataset.opt;
    sw.querySelectorAll('button').forEach(b=> b.classList.toggle('on', String(OPTS[k])===b.dataset.v));
  });
}
document.querySelectorAll('#fac .switch2 button').forEach(b=>{
  b.onclick = ()=>{
    const k = b.parentElement.dataset.opt;
    OPTS[k] = b.dataset.v;
    log('hipotese', k+'='+OPTS[k]);
    pintarOpts();
    if(S.screen==='wizard') marcarSujo('hipótese do teste'); else render();
  };
});
pintarOpts();

document.getElementById('btn-reset').onclick = ()=>{
  S = estadoInicial(); LOG.length=0; document.getElementById('log').innerHTML='';
  log('reiniciou'); render(); pintarSeed();
};
const btnSeed = document.getElementById('btn-seed');
function pintarSeed(){ btnSeed.textContent = S.segmentacoes.length ? 'Esvaziar lista' : 'Carregar exemplos'; }
btnSeed.onclick = ()=>{
  const cheia = S.segmentacoes.length > 0;
  S.segmentacoes = cheia ? [] : segmentacoesDemo();
  S.busca = ''; S.screen='list'; S.menuSeg=null; S.campAberta=null;
  log(cheia ? 'esvaziou-lista' : 'carregou-exemplos');
  render(); pintarSeed();
};
document.getElementById('btn-export').onclick = ()=>{
  const blob = new Blob([JSON.stringify({inicio:new Date(T0).toISOString(), opcoes:OPTS, eventos:LOG}, null, 2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sessao-teste-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';
  a.click();
};

/* ---------- boot ---------- */
S.estimativa = calcular();
render();
pintarSeed();
log('sessao-iniciada');
